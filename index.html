    '<rect x="'+(cx-15)+'" y="'+(cy+3)+'" width="14" height="4" rx="1" fill="rgba(233,228,219,.3)"/>';
  const cash=(cx,cy,red)=>'<g class="'+(red?'org-cash-red':'org-cash')+'"><rect x="'+(cx-15)+'" y="'+(cy-9)+'" width="30" height="18" rx="2"/><rect x="'+(cx-15)+'" y="'+(cy-13)+'" width="30" height="18" rx="2" opacity=".6"/><circle cx="'+cx+'" cy="'+(cy-4)+'" r="4" fill="rgba(4,7,14,.4)"/></g>';
  let g='';
  // --- connectors first (behind nodes) ---
  BRD.forEach(bx=>{ g+='<path class="org-conn dg-anim d2" d="M'+ORG+',74 C'+ORG+',96 '+bx+',92 '+bx+',112"/>'; });
  const bmap={170:[110,230],350:[350],530:[470,590]};
  BRD.forEach(bx=>bmap[bx].forEach(nx=>{ g+='<path class="org-conn dg-anim d3" d="M'+bx+',158 C'+bx+',186 '+nx+',182 '+nx+',204"/>'; }));
  NOM.forEach(cx=>{ g+='<line class="org-conn dg-anim d3" x1="'+cx+'" y1="246" x2="'+cx+'" y2="282"/>'; });
  // invoice web between shells
  g+='<path class="org-invoice dg-anim d3" d="M'+NOM[0]+',302 H'+NOM[NOM.length-1]+'"/>';
  NOM.forEach((cx,i)=>{ if(i<NOM.length-1) g+='<text x="'+((cx+NOM[i+1])/2)+'" y="299" text-anchor="middle" class="org-lbl" style="font-size:8px">€</text>'; });
  // drops through the water to cash
  NOM.forEach(cx=>{ g+='<path class="org-drop dg-anim d4" d="M'+cx+',324 V392"/>'; });
  // --- water ---
  g+='<rect class="org-water dg-anim d4" x="0" y="356" width="720" height="244"/>';
  g+='<path class="org-wave dg-anim d4" d="M0,356 q30,-7 60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0"/>';
  // --- nodes ---
  // organizer
  g+='<g class="dg-anim d1"><rect x="'+(ORG-62)+'" y="18" width="124" height="56" rx="8" class="org-node"/>'+person(ORG,52,17,'org-fig-dark')+'</g>';
  // breeders + one badge
  BRD.forEach(bx=>{ g+='<g class="dg-anim d2"><rect x="'+(bx-40)+'" y="112" width="80" height="46" rx="7" class="org-node"/>'+person(bx,142,13,'org-fig')+'</g>'; });
  g+='<g class="dg-anim d2"><rect class="org-badge" x="'+(BRD[2]+18)+'" y="122" width="60" height="20" rx="10"/><text x="'+(BRD[2]+48)+'" y="135.5" text-anchor="middle" style="font-family:var(--mono);font-size:9px;letter-spacing:.08em">2% CUT</text></g>';
  // nominees (person + tiny paper)
  NOM.forEach(cx=>{ g+='<g class="dg-anim d3">'+person(cx,228,12,'org-fig')+'<rect x="'+(cx+9)+'" y="216" width="12" height="15" rx="1" fill="rgba(233,228,219,.14)" stroke="var(--line-2)" stroke-width=".7"/></g>'; });
  // shells
  NOM.forEach(cx=>{ g+='<g class="dg-anim d3">'+shell(cx,302)+'</g>'; });
  // cards + cash below water
  NOM.forEach(cx=>{ const red=cx===CAUGHT; g+='<g class="dg-anim d4">'+card(cx,405,red)+cash(cx,486,red)+'<line class="org-drop" x1="'+cx+'" y1="418" x2="'+cx+'" y2="475" opacity=".4"/></g>'; });
  // caught ring
  g+='<ellipse class="org-caught-ring" cx="'+CAUGHT+'" cy="448" rx="42" ry="82"/>';
  g+='<text x="'+CAUGHT+'" y="545" text-anchor="middle" class="org-lbl" style="fill:var(--danger)">the fuse who gets caught</text>';
  // gutter row labels
  const L=(y,t,hi)=>'<text x="712" y="'+y+'" text-anchor="end" class="org-lbl'+(hi?' hi':'')+'">'+t+'</text>';
  g+='<g class="dg-anim d1">'+L(50,'the organizer')+'</g>';
  g+='<g class="dg-anim d2">'+L(139,'recruiters')+'</g>';
  g+='<g class="dg-anim d3">'+L(232,'nominees')+L(306,'shell companies')+'</g>';
  g+='<g class="dg-anim d4">'+L(352,'waterline',1)+L(410,'cash-out')+'</g>';
  const svg='<svg viewBox="0 0 720 570" role="img" aria-label="A pyramid: one organizer at the top, three recruiters below, then nominees, shell companies, and at the bottom under a waterline the cash withdrawals, one of them flagged red as the person who gets caught.">'+g+'</svg>';
  return dfig('The org chart of a laundering network', svg,
    'Every face below you is a layer of deniability. The recruiters take 2%; the nominees lend their names; the shells trade fake invoices with each other. Only the bottom row ever touches the cash — and only the bottom row ever meets the police.', 'orgchart-fig');
};

FIGS.manual = function(){
  const hl=(n,t)=>'<span class="md-hl" data-ann="'+n+'">'+t+'<sup>'+n+'</sup></span>';
  const paper='<div class="md-paper">'+
    '<div class="md-chrome"><span>Leaked · internal client guidance</span><span><span class="md-redact">████████ Bank</span> · Riga</span></div>'+

    '<p><b>1.</b> The delivery conditions specified in the contract or invoice '+hl(1,'should be realistic')+': when you specify goods, you have to think how they are going to be &lsquo;shipped&rsquo; ('+hl(2,'weight of the cargo, volumes, address of the manufacturing plant, type of transport')+': road, rail or ship). In the case of &lsquo;shipping&rsquo; of goods with very large volume or size, '+hl(3,'please specify a factory close to railroad or port')+'.</p>'+
    '<p style="margin-bottom:4px">For example:</p>'+
    '<p class="li">&mdash; There has to be mutual correspondence [between goods and transport]. '+hl(4,'Heavy industrial equipment (such as a crane) cannot be transported by a truck')+', or cement by sea, etc.</p>'+
    '<p class="li">&mdash; To indicate pickup at customer expense in a $3mn contract is not realistic&hellip;</p>'+
    '<p class="li">&mdash; If the production plant has no water or rail connection, then the question arises as to how the goods get transported to a port or railway station&hellip;</p>'+
    '</div>';
  const notes=[

    [2,'Think like a shipper','A real trader knows the weight, the volume, the plant address. The bank taught its criminal clients to <b>think like a logistics manager</b> &mdash; because that&rsquo;s the detail a bored compliance officer checks first.'],
    [3,'The geography giveaway','Ship something huge from a factory with no railway or port nearby and the lie collapses on a map. So the guide says: <b>pick a plausible address</b>. Forgery, down to the postcode.'],
    [4,'Physics has to agree','A crane can&rsquo;t go by truck; cement can&rsquo;t go by sea. The goods and the transport must be <b>mutually possible</b>. When they aren&rsquo;t, that&rsquo;s the thread an investigator pulls.']

{sec:'record', gauge:'Record', depth:0.05, kicker:'The record', meters:'Surface · 0 m',
 title:'Twenty-one million euros, and nowhere to put them'},
{p:"In Spain, one morning, the police announce a record. Twenty-one million euros in cash, seized in a single operation against a network accused of laundering billions for Europe's drug traffickers. And most of it wasn't in a vault: twenty million was bricked up <i>inside the walls</i> of a house belonging to a chief inspector of police, the man who ran Madrid's own financial-crime unit.{1} Twenty-one million: not in an account, not in bonds, but in physical banknotes, stacked and counted by hand.", cls:"first dropcap"},
{counter:{v:21000000, pre:"€", dur:3200, label:"seized in one operation. If the best network on the continent is still sitting on this much paper, the paper had nowhere to go."}},
{img:"b"},
{p:"Take a second on that number, because it tells you something the headline doesn't. If the smartest laundering network on the continent is still sitting on twenty-one million in paper cash, then laundering is <i>hard</i>. Harder than the movies make it look. Every hacker, every drug trafficker, every fraudster on earth shares one problem, and it is not the crime itself. It is what comes after: the money is dirty, and dirty money is almost useless. It cannot be spent, banked, or enjoyed without answering a single dangerous question: <i>where did this come from?</i>"},
{p:"Most of us have a vague mental image of how the answer gets faked. A briefcase, a casino, a Swiss account, a wink. But is the cliché anything like the truth? To find out, I did the unglamorous work: I read the experts' books, dug up FBI case files, and quietly monitored dozens of criminal forums on Telegram. What came back wasn't a cliché. It was a catalogue of methods that occasionally border on genius, and, on the other side of the glass, us: just as clever, working entirely to catch them."},
{p:"One more thing before we dive. I believe in vulgarization. An expert who can't explain their field to a non-expert isn't guarding secrets, they're larping an expertise they don't actually have. If I can't walk a normal person down this iceberg in plain language, then I never understood it myself. That's why I wrote this."},
{p:"So let's do something uncomfortable. For the length of this essay, the money is <i>yours</i>. You're going to have to hide it. And the deeper you go, the colder and stranger it gets, because money laundering is an iceberg. What everyone pictures is the tip. Almost all of it is underwater."},
{p:"Let's go down."},

/* ---------- THE TIP ---------- */
{sec:'tip', gauge:'Tip', depth:0.13, kicker:'The tip', meters:'0–10 m',
 title:'You have a problem, and it’s a nice one'},
{p:"Picture your operation. You're no Escobar; you run a small, efficient scam: SMS fraud, the kind of text everyone gets. <i>“Your parcel is held, pay €1.80 to release it.”</i> I know that text better than most: my day job is security for one of the world's largest logistics companies, and parcel fraud is our daily weather. A fraction of people click. A fraction of those enter their card details. Multiply by a few hundred thousand sends, and fraudulent transfers start landing. Congratulations: you have income. You also have your first real problem, and it's the same problem the €21-million ring had, just smaller.", cls:"first dropcap"},
{img:"c"},
{p:"You can't send that money to your own bank account. Do that, and the police are at your door by dinner time. So the very first question of your new career isn't <i>how do I steal more</i>. It's <i>who do I send it to?</i>"},
{p:"The most honest place to look for the answer is where the people doing it actually talk. In the Telegram channels of low-level cybercriminals, alongside the bragging and the screenshots, you find something remarkable: e-books. Genuine, step-by-step laundering manuals, passed around like study guides. And they mostly agree on where a beginner starts: with the oldest trick underneath all the others."},
{p:"<b>Stolen identity.</b> You need a bank account that isn't yours. To open one, you need someone else's identity documents, and getting those is far easier than it sounds. You don't hack anybody. You post a fake apartment listing on an online marketplace (Subito.it, or Facebook Marketplace), a nice flat at a good price, and you ask every hopeful applicant to send a front-and-back photo of their passport “to confirm they're serious.” They comply, because that's what broke students hunting for a flat do. I was one in Paris, and I can tell you: when a decent apartment at a fair price finally appears, you don't ask questions. You send the scan."},
{img:"d"},
{callout:"This, incidentally, is exactly why you should always stamp a visible watermark across any photo of your ID before sending it online: <b>“for [specific purpose], [date]”</b>, written straight across the document. A stolen copy becomes useless.", k:"Protect yourself"},
{p:"But a stolen ID alone won't open an account at a serious bank, because the banks changed the rules. They now run something called <b>Know Your Customer</b>, {{KYC}}, a set of checks that gets stricter every year. The signature move is the live selfie: open the app, film your own face on camera, prove you're a real human holding this document <i>right now</i>. That sounds impossible to fake, and it's supposed to be."},
{p:"Except some people read the onboarding flows of the neobanks (Revolut, N26 and their cousins) the way an engineer reads a rival's product, looking for the seam. One guide describes the seam plainly. You upload the stolen ID and a selfie you <i>also</i> talked your fake-apartment applicant into sending. Then, when the app asks you to film yourself live, you don't. You message customer support and say your camera is broken. And support, trying to be helpful, offers an alternative: <i>fine, just send us a proof of address instead.</i> A utility bill, the single easiest document on earth to forge. Change the name, change the address, upload. Done. And if I can walk you through it at all, it's because <b>it no longer works</b>: the banks have since closed that door. But for the longest time, this was the scammers' preferred way in."},
{img:"e"},
{motifcard:"Every control measure creates a <em>customer-experience bypass</em>, and the bypass is the way in.", k:"Rule nº1 · hold onto this example",
 s:"No control measure can be absolute: every rule has to bend somewhere for the honest customer it would otherwise lock out, the real person whose camera really is broken. That bend is the customer-experience bypass. Hold onto this example, because it repeats all the way down, and the bank's anti-fraud teams, on the far side of the glass, are thinking about the exact same thing."},
{p:"Say it worked, once. You now have a fraudulent transfer sitting in an account under a name that isn't yours. The pros call it a {{bank drop}}. You're not rich yet, and worse, you're on a timer, because within hours the banks talk to each other.", cls:"first"},

/* ---------- TIER 1 ---------- */
{sec:'tier1', gauge:'Tier 1', depth:0.28, kicker:'Tier 1 · The artisan', meters:'−40 m · below the waterline', stamp:true,
 title:'The cash trap',
 def:'Where every scheme starts: banknotes, mailboxes, betting slips, and shops with no customers.'},
{p:"Fraud-detection systems flag the pattern, messages fly between institutions, and the account freezes with your money inside it. So you don't let it sleep. You've already ordered debit cards on the account and you pull the money out as cash, fast, but not to your home. You have the cards delivered to an empty flat: find a property listed by an estate agent, put your name on its mailbox, and open that mailbox the way every postal worker on earth does, with a cheap universal mail key you can buy for the price of lunch. Empty the box, vanish.", cls:"first dropcap"},
{p:"Hackers borrowed a word from the military for this discipline: <b>opsec</b>, operational security, the art of leaving no thread that connects your real life to your criminal one. A mailbox that isn't yours is opsec at its cheapest. Remember the word, because almost everyone who falls in this story falls because they broke it."},
{img:"e2"},
{p:"Run that patiently and you might clear a few thousand euros a month in cash. And cash, at first, feels like freedom. It's untraceable. Keep your head down, spend it on ordinary life, and nobody asks anything."},
{p:"But cash is a trap, and everyone who's ever tried to hold a lot of it learns the same lesson. The bills pile up, literally, under the bed, and a pile of cash is a liability that grows. The wrong person finds it and it's gone, or worse. Even the greatest cash operator in history couldn't beat this. Pablo Escobar, at the peak of the Medellín cartel, had so many banknotes he buried them across Colombia; he made the men who hid them mark each spot on a map so he alone knew where his treasure lay. He also warehoused tons of it, and, as his own brother told it, the warehouses were a disaster. Damp, insects, and weather rotted the notes. By his brother's accounting, about <b>10%</b> of the stored cash was written off every year: eaten by rats, ruined by water, or simply lost.{2} Ten percent, gone to confetti, because there's a ceiling on how much physical money a human can actually keep."},
{img:"f"},
{p:"So burying it isn't clever. The clever move is to slip the cash quietly <i>into</i> the banking system, where it can earn interest, buy, and breathe. But now you've walked into our favorite hunting ground, because banks watch cash deposits like hawks. Deposit a suspicious amount and they ask for proof of origin: a document showing where it came from, a receipt for a sold jewel, anything. And if they have the faintest doubt, they don't argue with you. They quietly file a {{suspicious activity report}}, a note that goes straight to the national anti-money-laundering agency. You never even see it happen."},
{p:"I've watched this machinery from up close, from the victim's side. At one of my employers, an accountant fell for a spear-phishing email: a clean impersonation of the CEO, requesting payment for general services, cleaning and maintenance, the kind of banal invoice nobody reads twice. The accountant processed it. Close to €200,000 went out, split into transfers of up to €70,000, landing in three banks: one in Turkey, two in the UK. I worked on the recovery, chasing the money from bank to bank, and here is the detail that stayed with me. Even standing on the victim's side, with the fraud documented, I could not get a single bank to so much as <i>confirm</i> that a suspicious-activity report had been filed. The reports are real, and we read them, but the glass is one-way. You never see it happen, even when it's your money on the other side."},
{p:"To dodge that, launderers borrowed a trick Escobar helped popularize: {{smurfing}}. You take one big, conspicuous sum and shatter it into dozens of small, boring deposits spread across many accounts, each one flying under the reporting radar like a little blue Smurf."},
{pin:'smurf'},
{p:"It is the move Escobar's people turned industrial: dealers have famously used their extended families to open hundreds of accounts for exactly this. Does it hold up? Consider the case, drawn from the instruction file the investigation cites, of a French dealer known as “Farid.” The money moved through twelve bank accounts in his parents' names, and the investigating judge flagged “an astonishingly strong and ever-increasing savings capacity,” hundreds of thousands of euros arriving in large-denomination cash, which the couple insisted rested on nothing more than “a modest lifestyle.” Across those same years their <i>declared</i> income was so low it left them, most years, exempt from income tax.{3} That's the tell. Today the banks run pattern-detection software built specifically to spot the fingerprint of smurfing: many small deposits, many accounts, one invisible hand. The trick that once needed a family now needs to beat an algorithm.", cls:"first"},
{p:"Which leaves the artisan's real challenge, the one that governs this whole tier: to bank a large sum safely, you must be able to <i>explain</i> it. And you can't tell the truth, because the truth is theft. So you need a story: a legal-looking origin for illegal money. The old masters had beautiful ones."},
{p:"<b>The fake win.</b> This was the favorite of {{Francis “the Belgian”}}, one of France's last great gangster patriarchs. You spend your day at the betting parlor, and when a genuine punter hits a real jackpot, you offer to buy their winning ticket off them for a small premium. You cash it yourself, and out comes a beautiful, official receipt from the national lottery: a clean paper trail for money you didn't win. In 2017, a crew industrialized it, planting a network of accomplices in betting shops, buying up winning tickets on demand and funneling them all to a single corner tobacco-bar to be cashed.{4} Week after week, that one modest shop posted winnings of several thousand euros. You can guess how it ended. A betting parlor that wins every week eventually gets noticed."},
{img:"h"},
{p:"<b>The fake auction</b>, even prettier. Say you want to bank ninety thousand euros. You put an art object up for auction: an antique cupboard, say. An accomplice bids, and keeps bidding, driving the price to an absurd height no honest buyer would match. Minus the auctioneer's fee and your accomplice's cut, you now have a fully documented, legitimate reason for a €90,000 deposit. And the cupboard? It goes back home with you. The auction room doesn't even need a room anymore: neo-auction platforms, Catawiki and its cousins, move tens of thousands of lots a week, which makes a rigged bid cheaper to stage and easier to bury in the noise than it has ever been. EU rules now pull art intermediaries into anti-money-laundering duties above €10,000, but pattern-detection for collusive bidding is roughly where banks were with smurfing twenty years ago, and if anyone at those platforms is reading: that's a risk-and-fraud unit waiting to be built. It's one I'd be glad to help build, too. <u>If you're exploring this space</u>, get in touch: I have good leads on where to start.{5} Some experts believe the contemporary art market is inflated by around <b>20%</b> for exactly this reason.{6} Look closely at certain sales and they get strange: a painting by the comic-book artist Enki Bilal valued at €80,000 sells for €158,000; a piece estimated at €20,000 sells the next day for €184,960."},
{plant:"€184,960", pl:"oddly precise. remember this number."},
{p:"And this isn't just a French curiosity. {{1MDB}} was Malaysia's sovereign wealth fund, a pool of public money meant to develop the country, until between 2009 and 2015 more than $4.5 billion of it was siphoned out through shell companies and complicit banks, in what the US Justice Department has called the largest action ever brought under its kleptocracy initiative. The man at the center, financier Jho Low, had a problem you now recognize: billions that couldn't just sit in accounts. Art was a perfect answer, portable, unregistered, priced by mood. In one May 2013 week, accounts tied to Low bought five works at Christie's for $58 million, including Basquiat's <i>Dustheads</i> at $48.8 million, then a record for the artist. When the scheme collapsed, the DOJ clawed the art back through forfeiture: Van Gogh, Picasso, Warhol, Monet, surrendered by a man who is now a fugitive. The auction house had processed all of it without blinking. The paddles never ask where the money sleeps.{7}"},
{img:"i"},
{p:"So far, every trick has been a one-off: a ticket, a cupboard, a painting, each one explaining a single deposit. <b>The front business</b> is where the artisan stops improvising single alibis and builds a permanent one. You open a shop that naturally handles a lot of cash, a grocery, a barber, a pizzeria, and you fold your dirty money into its monthly takings. You don't even need real customers. Walk certain streets and you can read the whole scheme in the storefronts: a grocery, then another grocery, a shisha lounge next to a grill, a taco place, all shut in the middle of the day, no customers, one after another for twenty-five meters. That density is the smell of it.", cls:"first"},
{pano:true},
{p:"But if you want to run your front like an actual businessperson, you have to keep <i>two</i> sets of books. One secret ledger that honestly separates clean flows from dirty, and one official ledger for the tax office. And in the official one there's a single mistake that sinks amateurs: neglecting your costs. Your expenses have to be <i>coherent</i> with your revenue. If you sell pizzas at €10 and declare €300,000 in sales, you're claiming to have sold 30,000 pizzas, which means you'd better have bought 30,000 balls of dough. Plenty of people get caught precisely there, on the arithmetic of their own lie. Because now you've handed us a second way to see you: not just the money, but whether the money's <i>story</i> adds up.", cls:"first"},
{fig:"kebab"},
{p:"Build this out and you become, without noticing the moment it happened, the head of a genuine criminal small business: restaurants, construction firms, supermarkets, a network of cash-heavy shops that lets you wash more and more. And that's exactly when the ceiling arrives. Because your revenue keeps climbing, and the artisan's tricks, the tickets, the antiques, the pizzas, simply cannot digest the sums you're now handling.", cls:"first"},
{p:"Time to go deeper. But before we do, meet the people you've been hiding from this whole time."},

/* ---------- INTERLUDE 1 ---------- */
{bleed:{art:'glass', h:'220vh', plate:'Plate L', kicker:'Interlude · −80 m',
  title:'The other side of the glass',
  sub:"You've been picturing yourself as the only clever person in the story. You aren't, not by a long way.",
  veil:'#0B1626', veilK:0.9, veilOff:0.25, fadeK:1.9, cue:'keep descending'}},
{sec:'interlude1', gauge:'Glass', depth:0.40,
 def:'Every trick above exists because someone on the other side forced it into existence. Each layer of the iceberg is a scar left by a control.'},
{p:"Start with the shape of what you're up against. Around a bank sit the {{KYC}} checks that made you steal an identity in the first place. Behind the bank sits a <b>Financial Intelligence Unit</b>, Tracfin in France, FinCEN in the United States, the UIF in Italy, and a counterpart in almost every country: the agency that receives those suspicious-activity reports and decides which ones to pull. In France, {{Tracfin}} has what's called a <i>droit de communication</i>, a right of communication. It can reach into essentially any account at any domestic bank and read it. Inside your own country, you are transparent. There is no drawer we cannot open.", cls:"first dropcap"},
{p:"That single fact drives half of everything below. It's why you'll eventually reach for borders and havens. Not because they're exotic, but because they're the only walls Tracfin's X-ray can't see through. Domestically, the game is already lost; you're just choosing how long to delay the reveal."},
{p:"Then there's our sharpest and most patient weapon, the one that ends up catching almost everyone, and it isn't a forensic accountant. It's a rule so simple it sounds like a joke: <b>your lifestyle must match your declared income.</b> That's it. That's the Achilles' heel of every launderer who ever lived. You can build a flawless maze of shells and mixers and havens, but the moment you <i>enjoy</i> the money, the car, the villa, the watch, the flights, you create a gap between what you officially earn and how you visibly live. And that gap is a signal no encryption can hide. Tax authorities now run algorithms hunting for exactly this, “lifestyle anomalies,” cross-referencing what you spend against what you declare. The launderers who die free are the ones who never let the gap open. Almost nobody manages it, because the entire point of the money was to enjoy it."},
{p:"Hold both ideas as we descend the iceberg, because the rest of it is really a long argument between them. You keep creating distance: more accounts, more countries, more layers of obfuscation. We keep creating sight: more data-sharing, more algorithms, more cooperation. Every tier down is you buying a little more darkness, and the watchers slowly turning the lights back on."},
{p:"Now, the deep water."},

/* ---------- TIER 2 ---------- */
{sec:'tier2', gauge:'Tier 2', depth:0.52, kicker:'Tier 2 · Financial engineering', meters:'−400 m',
 title:'Mules, shells, and the theft of trust',
 def:'The sums jump a hundredfold, and laundering stops being a craft and becomes an industry.'},
{p:"You've traded the SMS scam for something far more lucrative: targeted fraud, the <b>“CEO scam,”</b> where you impersonate a company's boss and order an urgent wire transfer. The sums jump a hundredfold, and laundering stops being a craft and becomes an industrial process. A hundred-times-bigger sum also breaks everything you learned in Tier 1. A €100,000 transfer from a company to some individual's payment app is instantly, obviously wrong; the sending bank flags it as suspicious and suspends it before it lands. To move money like this, your receiving account has to look <i>reassuring</i>. It needs to sit inside a big, boring, traditional bank. And you can't open one of those with a stolen selfie, because they'll want you at a physical counter, in person, being a specific human being.", cls:"first dropcap"},
{p:"So you stop faking a person and start <i>renting</i> one. Enter the {{money mule}}: someone who lends you their real, legitimate bank account to move money through. Nobody agrees to that knowingly, because when the defrauded company realizes what happened, the first door the police knock on is the mule's, and in France the mule faces a banking ban, a <b>€375,000 fine, and five years in prison</b>. Other jurisdictions are no gentler.{8} Which means the entire mule economy runs not on money but on <i>manipulation</i>. This is the human machinery underneath the financial one, and it's uglier than any spreadsheet."},
{img:"n"},
{p:"The classic version is the <b>romance scam</b>. You seduce a lonely person online, build a real relationship over months, and, this is the discipline of it, you <i>resist</i> the urge to ask for money, because you're playing a longer game. Once you're trusted, you ask only for small favors. Receive this transfer. Forward that one. Just helping out. The impersonation of a celebrity is a favorite hook: the investigation describes a woman convinced for <b>thirteen years</b> that she was in a long-distance relationship with the actor Tyler Perry, a laundering operation wearing a lover's face the entire time. It sounds too absurd to be real, but the pattern is thoroughly documented: Tyler Perry's name is impersonated so relentlessly that the actor himself has warned fans it isn't him in their DMs, and one American woman handed a fake Perry roughly <b>$850,000</b> of her savings. In 2025, a French woman known as “Anne” made headlines after an AI-assisted fake Brad Pitt talked her out of €830,000. Thirteen years. Sit with how much patience, and how much cruelty, that represents.{9}", cls:"first"},
{img:"o"},
{counter:{v:13, dur:9000, suf:" years", cls:"danger", label:"of a fabricated relationship, maintained as financial infrastructure. This counter is slow on purpose."}},
{p:"Romance is labor-intensive, though, so there's a colder, cleaner variant: the <b>fake job</b>. You advertise a real-sounding position and you hire someone. They show up, and slowly realize the entire job is just executing transfer orders all day. But at that salary, are they really going to ask hard questions? You've bought their silence with a payslip, and you've bought yourself a layer of deniability, because on paper you have an <i>employee</i>, not an accomplice.", cls:"first"},
{fig:"jobcard"},
{p:"I don't say this from a distance. I've watched people my age, friends, former classmates, sharp people, get pulled toward exactly these “finance operations” roles off LinkedIn and Indeed. A brutal job market does most of the recruiter's work: when you've sent out two hundred applications and heard nothing, a well-designed offer promising real money for vague “payment processing” doesn't read as a trap. It reads as the break you finally caught. Desperation doesn't make people stupid; it makes smart people talented at not asking questions, and the people running these schemes know precisely which one they're fishing for."},
{p:"Even a mule with a great bank account isn't enough anymore, because the banks now watch company-to-individual transfers with real suspicion. So you go one level up the abstraction and put a {{shell company}} in the middle. You find a place where a company can be born anonymous, and the American state of Delaware is the connoisseur's choice.{10}{11} You install a {{nominee}}, a straw man, as the official director, have <i>him</i> open a corporate bank account, and now your bank drop wears a suit. It looks like a business."},
{fig:"delaware"},
{img:"p"},
{p:"You can't pull €100,000 in cash out of a corporate account, though, so you build a <b>chain of transfers</b>: fracture the money across a web of accounts dense enough to drown any investigator following it. But a web needs weavers, and building dozens of shell companies with dozens of nominees is more than one person can run. So you go back to the skill you've already mastered, hiring people who don't ask questions, and promote it a level: you take on middle managers, known in the jargon as <b>“breeders”</b>, specialists in recruiting mules at scale. The breeder skips the romance and the fake job ads; he doesn't hide the game at all. For a <b>2% commission</b>, plenty of people will happily move money, and he runs small test transactions first to make sure the pipeline actually delivers before trusting it with the real thing. You now have an org chart. You have HR.", cls:"first"},
{fig:"orgchart"},
{pin:'shells'},
{p:"Each of those companies, moving real sums, will be asked by its bank to justify the transactions. So you give your shells fake <i>lives</i>: invented commercial relationships, contracts and invoices between companies that don't really trade. A “delivery of dropshipped phone cases.” A consignment of cheap goods. It's hard to disprove, because no compliance officer is going to drive to the port of Gioia Tauro, the Calabrian mega-port long shadowed by the 'Ndrangheta, and crack open a shipping container to check. But, and here we leave our fingerprint again, you have to forge those invoices <i>correctly</i>. We know exactly how correctly, because in 2016 investigative journalists got hold of the internal client guides that several Latvian banks had written, real “how to fake a contract for dummies” manuals, drafted by the banks' own staff. One, from <b>Baltic International Bank</b>, is chillingly specific: the delivery terms on an invoice “should be realistic”, so if you're shipping something bulky, name a factory near a railway station or a port, or it won't look believable. The same documents coach clients on keeping each payment under the sizes that trip the monitors, and, the source investigation adds, on <i>never using round numbers</i> for smaller sums, because in real life invoices almost never land on a perfectly round total. Only launderers do.{12} And here is the uncomfortable truth it all points to, one the HSBC story waiting near the bottom of this iceberg will drive home: the bank is not always the launderer's obstacle. More often than most people imagine, the bank is <i>part of the machine</i>. Latvia's most notorious case, <b>ABLV</b>, was killed off in 2018 after US Treasury investigators concluded it had “institutionalised money laundering as a pillar of the bank's business practices.”{13}", cls:"first"},
{fig:"manual"},
{fig:"invoice"},
{p:"This is the deep lesson of Tier 2: laundering at scale isn't about money at all. It's about manufacturing <b>fake trust</b>. Fake employees, fake directors, fake companies, fake invoices. The banking system runs on trust, and if you can counterfeit trust convincingly enough, the money moves itself.", cls:"first"},
{p:"But no matter how many transactions you stack, as long as the money stays <i>inside one country</i>, Tracfin's right of communication means it can unravel the whole thing at will. To beat that, you need to add the one ingredient the domestic X-ray can't penetrate: a border."},
{fig:"machinemap"},

/* ---------- INTERLUDE 2 ---------- */
{sec:'interlude2', gauge:'Borders', depth:0.63, kicker:'Interlude · −900 m',
 title:'The six-month lag, and why the maze still fails',
 def:"Borders are the launderer's best friend and clearest confession, both at once."},
{p:"Tracfin has no authority over foreign banks. To see inside them it has to send a <b>cooperation request</b> to its counterpart abroad, and those take <i>months</i>, with some states far more helpful than others. Don't take a criminal's word for how well this works; take the judges'. In 1996, seven of Europe's best-known anti-corruption magistrates, Bernard Bertossa of Geneva and France's Renaud Van Ruymbeke among them, signed what became known as the <b>Geneva Appeal</b>. Their point wasn't that open borders were a mistake: Schengen was built to let people, goods, and money move freely across Europe, and that free movement is a real achievement. It was that criminal money now travelled at the same speed, while the judges and police chasing it still stopped dead at every national line.{14}", cls:"first dropcap"},
{p:"So your strategy writes itself. Every new country you route through is one more cooperation request, one more delay, one more headache for the investigators. You can push hundreds of thousands of euros across five jurisdictions in <i>minutes</i>; the investigators might need <i>six months per jurisdiction</i> to assemble the full picture. By the time they have it, you've rebuilt the entire circuit somewhere else. The money was never really hidden; it was only ever moving faster than the paperwork could follow.", cls:"first"},
{fig:"splitclock"},
{p:"For a while, that was enough, and the case every anti-laundering course still teaches shows how far it could be pushed. In the late 1980s, the Cali cartel had a problem: the fortune of one of its founders, <b>José Santacruz Londoño</b>, sat in Panama, and Panama was too close to the United States, which could lean on its little neighbor to freeze accounts on the faintest suspicion. So the cartel hired <b>Franklin Jurado</b>, a Colombian economist with a Harvard degree, at a reported <b>$1,000 a day</b>, to move the money somewhere safer.", cls:"first"},
{p:"Jurado's plan survives in a 20-page memoir he wrote himself, and it reads like the syllabus of the discipline: the three phases the investigation calls the <b>“Jurado classification.”</b>{15} <b>Placement</b>: feed the dirty cash into the banking system, here through accounts in Panama. <b>Layering</b>: drown its origin under transaction after transaction. Jurado ran what the jargon calls a <i>cavalry</i>, a stream of transfers each small enough to pass unremarked, threading over a hundred accounts at 68 banks across Europe, opened under invented names and the names of Santacruz's relatives and mistresses, then washed through freshly minted shell companies. <b>Integration</b>: bring it home clean, reinvested in legitimate Colombian businesses. About <b>$36 million</b> made the trip.{16}"},
{pin:'jurado'},
{img:"t"},
{p:"Then it slipped, twice, and neither slip was detective work. First, his bank in Monaco went bankrupt: the liquidators' audit of the wreckage surfaced thousands of suspicious transactions tied to Jurado and his family, the one event no route can plan around, because nobody chooses which bank dies. Then a neighbor in Luxembourg complained to the police about a strange hum coming from the house at night. It was a money-counting machine. The search that followed turned up his records, every operation written down, and the paper labyrinth unraveled in the most ordinary way imaginable: a Luxembourg court convicted him, and an American one added seven and a half years. That is the recurring truth of the whole iceberg. The maze doesn't have to be <i>solved</i>. It just has to <i>slip once</i>, and we have infinite patience to wait for the slip.", cls:"first"},
{p:"The borders themselves are also, slowly, closing. In the 1990s, states realized they were losing precisely because they couldn't cooperate fast enough, so they built the Financial Intelligence Units and wired them to talk to each other.{17} And when they talk, it works. A South African gang ran a spectacular CEO scam and layered the proceeds beautifully: first onto a US bank drop, then parachuted to three South African accounts, then dispersed across a dozen banks, finally condensing onto the criminals' personal accounts and converting into luxury cars. They were caught, because America's FinCEN simply <i>phoned</i> South Africa's FIU, which retraced the path and froze everything. Crossing a border used to mean vanishing. Now it just means someone has to make a phone call."},
{fig:"fiuweb"},
{p:"So you go deeper still, toward the places the phone call can't reach: the <b>bank-secrecy havens</b>, the “black holes of finance.” Secrecy runs on a dial that varies wildly by country. Near zero in France and the US, where the tax office sees everything; near total in places like Vanuatu or the British Virgin Islands, where even the authorities see nothing. Park your fortune there, behind a shell run by a nominee, and officially nothing links you to it. Then let that company <i>keep</i> you: it “hires” you for consulting, pays you generously, hands you perks. A company car. A villa by the sea. You never own anything. You just... live well, courtesy of a company that, on paper, is simply your employer."},
{p:"And there it is again, the trap that never stops working: <b>lifestyle</b>. Declare a modest income while living like royalty and you end up like <b>Teodorín Obiang</b>, the son of Equatorial Guinea's ruler and the country's vice-president, whose official ministerial salary was under <b>$100,000 a year</b>, yet who, US investigators calculated, spent about <b>$315 million</b> in seven years on the visible trappings of a fortune. In Paris alone he kept a <b>101-room mansion on Avenue Foch</b> worth over €100 million, a garage of Ferraris and Bugattis, and two million dollars of Michael Jackson memorabilia, down to the star's crystal-studded glove. The gap between the salary and the spending <i>was</i> the case: in 2017 a French court convicted him of laundering, handed him a suspended sentence and a €30 million fine, and <b>seized the lot</b>.{18} He wasn't undone by a flaw in the network but by the oldest flaw in the launderer: he enjoyed it where everyone could see."},
{fig:"obiang"},
{p:"The truly disciplined don't flaunt; they <i>invest</i>, quietly and defensively. Failing companies, for instance, ask fewer questions. A Russian mafia was found targeting struggling football clubs, and Portugal's UD Leiria, relegated and broke in 2012, was rescued by a mysterious benefactor who bought 70% of it through a Russian group buried behind shells in tax havens, until no one on earth could say who really owned the club. Property is the best hiding place of all, and it's worth understanding why. A house or a building is worth a fortune on its own, so pushing millions through it never looks strange, and unlike a bank account, no one is obliged to record who actually stands behind the purchase. The dirty money hides in plain sight, as bricks and mortar.{19}", cls:"first"},
{chips:[
  {v:"⅔", l:"of French real estate held through companies has an owner who still can't be identified from the registers, despite the 2017 EU beneficial-ownership rules."},
  {v:"33,000", l:"French mansions bought by people describing themselves as unemployed, students, or homemakers. Nominees, almost to a certainty."},
  {v:"11%", l:"of French land parcels have no known owner whatsoever."}
]},
{p:"And the crown jewel of this tier, the trick that lets you finally <i>spend</i>, is the <b>back-to-back loan</b>, invented by <b>Meyer Lansky</b>, the financial brain of the American Cosa Nostra. Lansky watched the supposedly untouchable Al Capone get destroyed not by murder charges but by <i>tax evasion</i>, and swore never to make that mistake. So: deposit your $5 million of dirty money in a Swiss bank as <i>collateral</i>, then ask that same bank for a $5-million <i>loan</i>. You're borrowing your own money, which looks insane until you see the magic. Back home, that $5 million is now a clean foreign loan. If anyone asks, a foreign bank lent it to you on terms that are nobody's business, and you don't even pay tax on borrowed money. Lansky used it to help build a city of casinos in the desert (<i>we can thank the Swiss for Las Vegas</i>), and the same trick later underpinned the {{Pizza Connection}}, a network of thousands of Italian-run pizzerias distributing heroin across America. It remains a favorite of corrupt politicians to this day.", cls:"first"},
{fig:"b2b"},
{img:"v"},
{p:"Your circuit is now robust, international, and elegant. It also has one fatal flaw, and by now you can probably name it yourself. Every layer of it, every shell, every loan, every haven, ultimately rests on the <i>banking system</i>. Which means it is, in the end, <b>traceable</b>. It would take only a burst of alertness from one bank, or American pressure on one haven, for the whole beautiful structure to fall. To truly escape, you have to leave the banks behind altogether.", cls:"first"},
{p:"Welcome to the cold part of the iceberg."},

/* ---------- TIER 3 ---------- */
{bleed:{art:'deep', h:'220vh', plate:'Plate W', kicker:'Tier 3 · below −2,000 m',
  title:'Deep-sea economies',
  sub:'Whole markets drift down here that were never designed to move dirty money, and are almost perfect for it.',
  veil:'#03060B', veilK:0.85, veilOff:0.3, fadeK:1.9, cue:'darker still'}},
{sec:'tier3', gauge:'Tier 3', depth:0.75, kicker:'Tier 3 · Parallel markets', meters:'−2,000 m',
 title:'Money that isn’t money'},
{p:"Down here, the goal is to move value <i>without ever touching a bank wire</i>. The oldest way is <b>trade-based laundering</b>: turning money into goods, and goods back into money, across a border.{20} Irish police dismantled an SMS-scam gang exfiltrating millions to Nigeria this way. They simply bought things online, alcohol, clothes, electronics, and shipped them, so long as the goods were compact and easy to resell. Today an entire grey web makes that goods step frictionless: directories like {{KYCnot.me}} catalogue hundreds of shops and services that take crypto and never ask for ID, turning dirty coins into gift cards, electronics, or resellable goods with no name ever attached. It moves value between countries with a <i>zero</i> banking footprint, which is beautiful. It also demands insane logistics, tons of merchandise, distribution across dozens of shops, which is why the modern launderer reaches instead for something lighter: <b>parallel currencies</b>.", cls:"first dropcap"},
{chips:[{v:"€1.7M", l:"of medicines, bought online in a single order and shipped for resale. Value moved between continents; no bank ever touched it."}]},
{p:"You've heard of Roblox: a children's video game, a vast virtual playground where players buy things from each other using an in-game currency called Robux. In a court case, Roblox was forced to actually <i>look</i> at its own marketplace, and found that hundreds of people were using Robux to wash money. Dirty dollars converted to Robux, scattered through hundreds of tiny transactions to accomplice players, then reconsolidated onto a few accounts and cashed back out to dollars. It worked so well the same trick spread to Minecraft, FIFA, and Fortnite.", cls:"first"},
{p:"But the biggest arena of all isn't a children's game: it's <b>Counter-Strike</b>. Its cosmetic weapon “skins” trade on Steam and on a swarm of third-party sites as a real speculative market, worth by some 2025 estimates more than <b>$6 billion</b>. Skins are the perfect laundering token: scarce, tradable worldwide in seconds, and priced by hype rather than any fixed value. It got bad enough that in 2019 Valve, the game's maker, stopped letting newly bought loot-box keys be traded at all, stating that “nearly all” such key purchases had become <i>fraud-sourced</i>. The game is called <b>CS2</b> now, but the market, and the loophole, only got bigger.{21}"},
{img:"x"},
{chips:[
  {v:"50M", l:"users on Roblox. A playground big enough to hide a market inside."},
  {v:"50+", l:"purchases of one single game item from the same seller, in the pattern the court forced into view."},
  {v:"$6B", l:"the estimated 2025 market for Counter-Strike (CS2) skins, the biggest laundering-friendly game economy of all."}
]},
{p:"Which pushes you toward the currency everyone assumes was built for crime: <b>crypto</b>. Except crypto has a weakness people forget. Its transactions are <i>public</i>, written on a ledger anyone on earth can read in real time. To launder it you need to manufacture fog, and the undisputed master of crypto fog is the <b>Lazarus Group</b>, North Korea's state hacking militia, whose entire job is raising hard currency for Kim Jong-un's weapons program. Five years ago Lazarus faced a nightmare. They'd stolen roughly <b>$4 billion</b> in crypto, but their wallets were blacklisted: move a single coin to an exchange and it would freeze instantly. So they built the <b>{{peel chain}}</b>.", cls:"first"},
{pin:'peel'},
{p:"And to be safe they ran peel chains <i>of</i> peel chains. They also tried {{mixer}}s, services that pool many users' coins into a common pot and redistribute them in random amounts at random times, breaking the chain of traceability. But mixers only dilute well in small quantities. Even for a nation-state, crypto simply could not <i>digest</i> the sums.", cls:"first"},
{p:"Which is why the North Koreans' most effective tool wasn't digital at all. It was the <b>casino</b>. In February 2016, Lazarus stole <b>$81 million from Bangladesh's central bank</b>, and washed it through casinos in the Philippines with a simple recipe: convert the money to chips, play, then cash the “winnings” out onto accomplice accounts or as clean cash. Won't they lose it all gambling? No. That's the craft. They play <b>baccarat</b>, which, played with precise discipline over many hands, caps your losses at around <b>10%</b>. They rent private rooms filled only with accomplices, bet suitcases of chips week after week, convert them, and ship them onward to casinos in <b>Macau</b>, where the trail simply evaporates. A ten-percent “laundering fee” paid to the house, and the money walks out clean."},
{img:"z"},
{fig:"feemeter"},
{p:"Roblox, Bitcoin, baccarat. Run all three well enough and you become something genuinely frightening: the Jeff Bezos of organized crime, running a multinational that clears <i>billions</i> a year.{22} And at that scale, catastrophically, every technique in this essay stops working. Bitcoin can't digest billions. Casinos can't digest billions. The banks aren't blind. So the billions just... pile up, in underground pools, and you start to wonder if you'll simply have to watch it rot like Escobar's rat-eaten warehouses. Until a man in a suit walks up and makes you an offer that changes everything.", cls:"first"},
{p:"Welcome to the deepest part of the iceberg."},

/* ---------- TIER 4 ---------- */
{sec:'tier4', gauge:'Tier 4', depth:0.88, kicker:'Tier 4 · Institutional complicity', meters:'−4,000 m',
 title:'When the machine is the mole',
 def:'The deepest layer, where the system built to catch you has been turned into your accomplice.'},
{p:"The man in the suit says: <i>I can launder your billions. And it won't cost you the 10 or 15% the mafias charge. It'll cost you 0.1%.</i>", cls:"first dropcap"},
{p:"How is that possible? Because he isn't hiding <i>from</i> a bank. He <i>is</i> the bank. Or he owns one, or he's bought someone inside one. A <b>corrupt banker charges 0.1%</b> because he isn't dodging the controls; he's <i>switching them off</i> from the inside."},
{p:"You'd assume this only happens at some grubby regional bank. It doesn't. In the 2010s, investigators found a bank of genuinely global rank in league with Mexican cartels: cartels moving an almost unbelievable <b>$50 billion in cash every year</b>, while everyone wondered how they placed it into the system so easily. The answer was <b>HSBC</b>. Couriers carried Samsonite suitcases and gym bags stuffed with hundred-dollar bills fresh off the streets of Los Angeles, Seattle, Chicago. They were so comfortable they wore leather jackets bearing the Sinaloa cartel's insignia on the back; in one Mexico City branch they strolled in with their cartel colors on and were shown to <i>special counters</i> built to process their bags of cash. The Americans eventually hid surveillance cameras inside the bank, gathered the evidence, and prosecuted. After years of proceedings, HSBC paid a fine of <b>$2 billion</b>."},
{img:"aa"},
{fig:"fineflow"},
{hold:"<b>No one</b> went to prison."},
{p:"Sit with that, because it's the moral floor of the entire iceberg. At the bottom, the punishment for laundering tens of billions is a fee.", cls:"first"},
{p:"Sometimes it's not a whole bank, just a lone <b>insider</b>, a trusted employee betraying everyone around them. In 2017, the UK found the head of personal accounts at Barclays secretly running a laundering circuit for a Moldovan gang."},
{chips:[
  {v:"1", l:"Barclays employee: the head of personal accounts."},
  {v:"400", l:"accounts, quietly operated across Europe."},
  {v:"€17M", l:"laundered before anyone noticed anything at all."}
]},
{p:"But the true bottom of the iceberg, the largest laundering machine ever uncovered, wasn't one crook or one bank. It was an <i>industrialized service</i>, and its innovation was almost beautiful in its efficiency. A group of East European financiers found a bank willing to look the other way, {{Ūkio Bankas}}, a Lithuanian bank that collapsed in 2013, and built the familiar machine of shells, nominees, and fake invoices. Then they added one brilliant twist. Instead of each criminal client getting their own dedicated shells and accounts, <i>everyone shared the same ones</i>, simultaneously, for a colossal economy of scale. To feed a shared machine you need enormous volume, so they went out and <i>pitched</i> hundreds of criminal organizations, like a startup chasing enterprise clients. It worked. A consortium of journalists led by OCCRP, working from a leak of banking records, named the result a <b>“Laundromat”</b> when they published it in 2019. The leaked records were staggering: 1.3 million transactions, and, by some tallies, as much as €26 billion of dirty money pushed through a core of just 75 shell companies.{25}", cls:"first"},
{img:"ab"},
{fig:"abcounters"},
{p:"And the leak revealed one more thing, the detail that should genuinely chill you. It wasn't the <i>only</i> one. A parallel operation, the “Azerbaijani Laundromat,” had been running at the same time.{26} Which means there will, more or less always, be an automatic laundromat open for business somewhere. The service is not a fluke. It's infrastructure.", cls:"first"},
{p:"That's the floor. You can't go deeper than a bank that has agreed, for a fee, to stop being a bank. So the only question left isn't <i>how do I hide the money</i> anymore."},
{p:"It's: <i>what is all this for?</i>"},

/* ---------- ENDGAME ---------- */
{sec:'endgame', gauge:'Endgame', depth:0.96, kicker:'The endgame', meters:'rising',
 title:'Buying the world, and the light that finds you',
 def:"Say you've won. You have twenty billion clean. What is it actually for?"},
{p:"You could buy a private island, a Premier League football club, a fleet of superyachts. But you won't, because there's something better to buy: <b>control</b>.", cls:"first dropcap"},
{p:"Researchers who studied the mafias' effect on the economy named the endgame <b>“distortion of competition,”</b> and the Italian mafias are its masters. They take over an ordinary business, restaurants, say, and here's the move that a legal competitor can never answer: they don't actually <i>need</i> the restaurant to make money, because its real job is laundering. So they sell at a loss, deliberately, undercutting every honest rival until the competition is dead and they own a <i>monopoly</i>. And then, quietly, they raise the prices back up. Run that across a region and whole sectors tip over: construction, tourism, cleaning, catering. Dirty money didn't just hide inside the economy. It bought the economy. Nowhere shows it more starkly than Calabria, the 'Ndrangheta's home ground: in the province of Vibo Valentia, the 2023 Rinascita-Scott maxi-trial, one of the largest in Italian history, ended with courts convicting more than 200 people and confiscating the supermarkets, bars, construction firms and tourism businesses the clan had quietly absorbed.{27}"},
{img:"ac"},
{fig:"italy"},
{p:"And even that isn't the final rung, because economic power has a natural hunger for the real thing: <b>political power</b>. With a fortune laundered and a reputation as a self-made success, why not run for office? You wouldn't be the first. Pablo Escobar tried in 1982. He made money rain on his district, built schools and football stadiums, bribed the local press, and got himself <i>elected to Colombia's Congress</i>. But his reputation preceded him; the government opened an investigation, proved he'd financed the campaign with hidden money, and annulled the election. Because, and this is the last and most important rule of the whole iceberg, <b>the moment you step into the light, your entire story gets combed through</b>. No matter how well you laundered, are you truly certain that if someone digs deep enough, they'll find <i>nothing</i>?", cls:"first"},
{img:"ad"},
{p:"That was exactly Joe Kennedy's problem. During Prohibition he ran bootleg alcohol and, allied with the New York mafia, became a billionaire. But his real ambition was the White House. He couldn't win it for himself. He backed Roosevelt's rise, spent freely, made himself useful, and once Roosevelt held power, Roosevelt rejected him anyway, because of his reputation. So Joe changed strategy. He kept his <i>son</i> scrupulously clean, far from the family's dirty machinery, white as snow. And in 1960 he spent without counting, bought delegate votes across the key states, and made that son the <b>35th President of the United States</b>.", cls:"first"},
{p:"You know how that story ends, too. Which is the quiet joke underneath the entire iceberg: the surest way to launder a fortune completely is not to enjoy it, not to spend it, not to be seen, but to pour it, invisibly, into the <i>next</i> generation, and let them stand in the light you never could."},
{descentmap:true},

/* ---------- AE · SURFACING ---------- */
{bleed:{art:'coda', h:'240vh', plate:'Plate AE', kicker:'Coda',
  title:'Surfacing',

  veil:'#EDE8DF', veilK:1.3, veilOff:0.35, fadeK:2.2, txtColor:'var(--bone)'}},

/* ---------- CODA ---------- */
{sec:'coda', light:true, gauge:'Surface', depth:0, kicker:'Back at the surface',
 title:'The crack that never closes'},
{p:"From a €1.80 phishing text to shell mazes designed by Harvard economists to a global bank building special counters for cartel cash. That's the iceberg, and the thing worth remembering is that its depth isn't a measure of criminal genius. It's a measure of <i>pressure</i>.{28} Every layer exists because a control measure forced it into being. KYC created the stolen identity. Suspicious-activity reports created smurfing. The right of communication created the border. The border created the haven. Each new eye we opened, the launderer answered by digging one layer deeper. And each layer cost more, leaked more, and trusted more strangers.", cls:"first dropcap"},
{fig:"lifestyle:coda"},
{p:"Which is why, for all its ingenuity, the whole structure rests on a single crack that never fully closes: <b>your life has to match your income</b>. Obiang's Ferraris, the parents too poor to pay tax but rich enough to save, the invoice that landed on a suspiciously round number, Escobar's story combed apart the day he reached for the light. Over and over, it isn't the maze that fails. It's the human being at the center of it, who wanted, in the end, to actually <i>have</i> the money. We don't need to solve the puzzle. We just need to wait for the person to enjoy their winnings.", cls:"first"},
{p:"The €21 million inside those Spanish walls was never the point. It was the evidence: proof that even the best in Europe couldn't finish the job, that the cash still had nowhere clean to go. The tip of the iceberg isn't the money they hid."},
{p:"It's the money that never made it under the water."},
{p:"And of course: don't go trying any of it. Why bother? The arithmetic has never been worse for you. Forensic finance keeps drawing more and more young, curious, frighteningly sharp minds to the other side of the glass, and I've had the luck of collaborating with some of the brightest of them along the way. If that's who's waiting under the surface, the water is only getting colder."},
{callout:"With a special thank-you to <b>Selim Arslan</b>, who spent his first years in the trade freezing mule accounts on a neobank's fraud desk, and now traces cross-border laundering networks for clients who can't talk about it. He is one of the finest financial-crime minds I've had the privilege to work with: the kind of investigator who reads a web of shell companies the way the rest of us read a metro map, and hears the wrong note in a balance sheet from across the room. A good part of whatever is sharp in this essay comes from conversations with him; the mistakes are all mine.", k:"Acknowledgment"}
];

/* ================= structural builders ================= */
function descentBlock(){
  const CX=450, APEX=70, BOT=1010;
  const LEFT=[[450,70],[435,150],[350,246],[300,340],[332,430],[276,520],[312,648],[352,760],[392,872],[448,1010]];
  const RIGHT=[[450,70],[515,150],[590,246],[642,352],[600,438],[678,540],[604,656],[560,766],[528,876],[452,1010]];
  const pts=a=>a.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');
  const fillPath=pts(LEFT)+' '+RIGHT.slice().reverse().map(p=>'L'+p[0]+' '+p[1]).join(' ')+' Z';
  const MARKS=[
    {y:120,side:'R',t:'The tip',d:'0–10 m',s:'SMS fraud — the €1.80 text'},
    {y:300,side:'L',t:'Tier 1 · the artisan',d:'−40 m',s:'cash · betting slips · front shops'},
    {y:470,side:'R',t:'Tier 2 · engineering',d:'−400 m',s:'mules · shells · fake invoices'},
    {y:650,side:'L',t:'Tier 3 · parallel markets',d:'−2,000 m',s:'games · crypto · casinos'},
    {y:835,side:'R',t:'Tier 4 · complicity',d:'−4,000 m',s:'complicit banks · the Laundromat',danger:1}
  ];
  let marks='';
  MARKS.forEach(m=>{
    const L=m.side==='L', lx=L?250:650, ax=L?250:650, anchor=L?'end':'start';
    marks+='<g class="desc-mark'+(m.danger?' danger':'')+'" data-y="'+m.y+'">'+
      '<line class="dm-lead" x1="'+CX+'" y1="'+m.y+'" x2="'+ax+'" y2="'+m.y+'"/>'+
      '<circle class="dm-halo" cx="'+CX+'" cy="'+m.y+'" r="9"/>'+
      '<circle class="dm-dot" cx="'+CX+'" cy="'+m.y+'" r="4"/>'+
      '<text class="dm-t" x="'+lx+'" y="'+(m.y-10)+'" text-anchor="'+anchor+'">'+m.t+'</text>'+
      '<text class="dm-d" x="'+lx+'" y="'+(m.y+6)+'" text-anchor="'+anchor+'">'+m.d+'</text>'+
      '<text class="dm-s" x="'+lx+'" y="'+(m.y+24)+'" text-anchor="'+anchor+'">'+m.s+'</text>'+
      '</g>';
  });
  const svg='<svg class="descent-svg" viewBox="0 0 900 1070" role="img" aria-label="The whole iceberg of money laundering, every tier pinned at its depth: the SMS-fraud tip above water, then the artisan, financial engineering, parallel markets, and at the bottom institutional complicity.">'+
    '<defs><linearGradient id="descgrad" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0" stop-color="rgba(127,179,213,.20)"/><stop offset="0.5" stop-color="rgba(127,179,213,.09)"/><stop offset="1" stop-color="rgba(62,124,79,.05)"/></linearGradient>'+
      '<clipPath id="desc-reveal"><rect x="0" y="0" width="900" height="1070"/></clipPath></defs>'+
    '<line class="desc-wave" x1="20" y1="150" x2="880" y2="150"/>'+
    '<text x="24" y="143" class="dm-d" style="fill:var(--ink-faint)">the waterline · everything below is underwater</text>'+
    '<path class="desc-fill" d="'+fillPath+'" fill="url(#descgrad)" clip-path="url(#desc-reveal)"/>'+
    '<path class="desc-edge" d="'+pts(LEFT)+'"/>'+
    '<path class="desc-edge" d="'+pts(RIGHT)+'"/>'+
    marks+
    '<g class="desc-cursor"><line x1="20" y1="0" x2="880" y2="0"/><text class="dc-tag" x="880" y="-6" text-anchor="end">surface</text></g>'+
    '</svg>';
  const sec=el('section','descent-track'+(SCRUB?'':' static'));
  if(SCRUB) sec.style.height='340vh';
  sec.innerHTML='<div class="descent-sticky"><figure class="descent-panel">'+
    '<div class="dp-h">The whole descent</div>'+
    '<div class="dp-sub">Every technique you passed, pinned at its depth.</div>'+
    svg+'<div class="dp-hint">scroll to sink ↓</div></figure></div>';
  return sec;
}

function bleedBlock(b){
  /* b: {art, kicker, title, sub, byline, h1, plate, dark} */
  const sec=el('section','pin-track bleed'+(b.cls?' '+b.cls:''));
  sec.style.height = REDUCED ? 'auto' : (b.h||'230vh');
  const light = b.lightText===false;
  const inner=el('div','pin-sticky'+(b.zone?' '+b.zone:''));
  const tall = (b.art==='hero'||b.art==='coda');
  inner.innerHTML =
    '<div class="bleed-art'+(tall?' tall':'')+'" aria-hidden="true">'+bleedArt(b.art)+'</div>'+
    '<div class="bleed-veil" style="background:'+(b.veil||'#0B1626')+';opacity:calc(var(--p,0)*'+(b.veilK!=null?b.veilK:1.05)+' - '+(b.veilOff!=null?b.veilOff:0.12)+')"></div>'+
    '<div class="bleed-txt" style="color:'+(b.txtColor||'var(--bone)')+';opacity:calc(1 - var(--p,0)*'+(b.fadeK!=null?b.fadeK:2.1)+')">'+
      (b.kicker?'<div class="bk">'+b.kicker+'</div>':'')+
      (b.h1?'<h1>'+b.h1+'</h1>':(b.title?'<h2>'+b.title+'</h2>':''))+
      (b.sub?'<p class="bs">'+b.sub+'</p>':'')+
      (b.byline?'<div class="bb">'+b.byline+'</div>':'')+
    '</div>'+
    (b.cue?'<div class="scrollcue" style="color:'+(b.cueColor||'var(--ice)')+'">'+b.cue+'</div>':'');
  sec.appendChild(inner);
  if(REDUCED) sec.style.setProperty('--p', b.art==='hero'?'0.1':'0.3');
  return sec;
}

function pinnedBlock(key){
  const P=PINS[key];
  if(STACK){
    const wrap=el('div');
    for(let s=0;s<P.steps;s++){
      const f=el('figure','stackfr rv');
      f.innerHTML='<div class="d-title" style="font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ice);margin-bottom:6px;text-align:center">'+P.title+' · '+(s+1)+'/'+P.steps+'</div>'+
        '<div class="pd-frame" data-step="'+s+'">'+P.svg()+((s===P.steps-1&&P.extra)?P.extra:'')+'</div>'+
        '<figcaption>'+P.caps[s].replace(/<\/?b>/g,'')+'</figcaption>';
      wrap.appendChild(f);
    }
    return wrap;
  }
  const sec=el('section','pin-track pinned-dg');
  sec.dataset.pin=key;
  sec.style.height=((P.steps+1)*100)+'vh';

function markText(s){

/* ================= scroll engine ================= */
const BG_DARK=[[11,22,38]];
let bgStops=[], zoneTops=[], tracks=[], docH=1, vh=1;

function hexToRgb(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];}
function measure(){
  vh=innerHeight;
  docH=document.documentElement.scrollHeight-vh;
  zoneTops=ZONES.map(z=>({id:z.id,top:z.el.offsetTop,h:z.el.offsetHeight,depth:z.depth}));
  tracks=[...document.querySelectorAll('.pin-track')].map(t=>({el:t,top:t.offsetTop,h:t.offsetHeight,steps:t.dataset.pin?PINS[t.dataset.pin].steps:0,key:t.dataset.pin||null,last:-1}));
  /* background stops: bone → dark ramp across hero, dark shades per zone, light again at coda */
  const stops=[];
  const hero=document.querySelector('.pin-track.bleed');
  stops.push({y:0,c:hexToRgb('#EDE8DF')});
  if(hero){ stops.push({y:hero.offsetTop+vh*0.6,c:hexToRgb('#EDE8DF')});
            stops.push({y:hero.offsetTop+hero.offsetHeight-vh*0.4,c:hexToRgb('#16273D')}); }
  const shade={ 'sec-record':'#16273D','sec-tip':'#13223A','sec-tier1':'#101D31','sec-interlude1':'#0D1829','sec-tier2':'#0B1626','sec-interlude2':'#091320','sec-tier3':'#060D18','sec-tier4':'#04070E','sec-endgame':'#0A1424' };
  zoneTops.forEach(z=>{ if(shade[z.id]) stops.push({y:z.top,c:hexToRgb(shade[z.id])}); });
  const coda=document.getElementById('sec-coda');
  const ae=[...document.querySelectorAll('.pin-track.bleed')].pop();
  if(coda&&ae&&ae!==hero){ stops.push({y:ae.offsetTop,c:hexToRgb('#0A1424')}); stops.push({y:ae.offsetTop+ae.offsetHeight-vh*0.3,c:hexToRgb('#EDE8DF')}); }
  stops.sort((a,b)=>a.y-b.y);
  bgStops=stops;
  /* mobile tick positions */
  document.querySelectorAll('.mp-tick').forEach(t=>{ const z=zoneTops.find(z=>z.id===t.dataset.zone); if(z) t.style.left=Math.min(99,(z.top/docH*100))+'%'; });
}

const marker=()=>document.getElementById('g-marker');
let raf=false;
function onScroll(){ if(!raf){ raf=true; requestAnimationFrame(frame); } }
function frame(){
  raf=false;
  const y=scrollY, mid=y+vh*0.5;
  /* bg lerp */
  let c=bgStops[0].c;
  for(let i=0;i<bgStops.length-1;i++){
    const a=bgStops[i],b=bgStops[i+1];
    if(mid>=a.y&&mid<=b.y){ const t=(mid-a.y)/Math.max(1,b.y-a.y); c=[0,1,2].map(k=>Math.round(a.c[k]+(b.c[k]-a.c[k])*t)); break; }
    if(mid>b.y) c=b.c;
  }
  document.body.style.backgroundColor='rgb('+c.join(',')+')';
  /* pins */
  tracks.forEach(t=>{
    const p=Math.max(0,Math.min(1,(y-t.top)/Math.max(1,t.h-vh)));
    if(Math.abs(p-(t.p||0))>0.002||t.last<0){ t.p=p; t.el.style.setProperty('--p',p.toFixed(3));
      if(t.steps){ const s=Math.max(0,Math.min(t.steps-1,Math.floor(p*t.steps*1.04)));
        if(s!==t.last){ t.last=s;
          t.el.querySelector('.pd-frame').dataset.step=s;
          t.el.querySelectorAll('.pcap').forEach((c2,i)=>c2.classList.toggle('on',i===s));
          t.el.querySelectorAll('.pd-dots i').forEach((d,i)=>d.classList.toggle('on',i===s));
        } }
    }
  });
  /* depth gauge + mobile bar */
  let depth=0, active=null;
  for(let i=0;i<zoneTops.length;i++){
    const z=zoneTops[i], next=zoneTops[i+1];
    if(mid>=z.top&&(!next||mid<next.top)){
      active=z.id;
      const zp=Math.max(0,Math.min(1,(mid-z.top)/Math.max(1,(next?next.top:docH+vh)-z.top)));
      const nd=next?next.depth:z.depth;
      depth=z.depth+(nd-z.depth)*zp;
      break;
    }
  }
  if(mid<zoneTops[0]?.top) depth=0;
  const m=marker(); if(m){ m.setAttribute('cy', depth<=0.001?40:GA.TOP+depth*(GA.BOT-GA.TOP)); }
  document.querySelectorAll('#gauge .g-tick').forEach(t=>t.classList.toggle('on',t.dataset.target===active));
  const bar=document.querySelector('#mprog .mp-bar'); if(bar) bar.style.width=(Math.max(0,Math.min(1,y/docH))*100)+'%';
}

/* ================= reveals / counters / interactions ================= */
function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
function runCounter(sp){
  const v=+sp.dataset.count, dur=+sp.dataset.dur||2400, delay=+sp.dataset.delay||0, pre=sp.dataset.pre||'';
  if(REDUCED){ sp.textContent=pre+fmt(v); return; }
  setTimeout(()=>{
    const t0=performance.now();
    (function tick(now){
      const p=Math.min(1,(now-t0)/dur);
      sp.textContent=pre+fmt(v*ease(p));
      if(p<1) requestAnimationFrame(tick);
    })(t0);
  },delay);
}
function initIO(){
  const io=new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting){
    e.target.classList.add('in'); io.unobserve(e.target);
    e.target.querySelectorAll('[data-count]').forEach(runCounter);
    if(e.target.matches('[data-count]')) runCounter(e.target);
    e.target.querySelectorAll('.italy-fill').forEach(r=>{ const h=+r.dataset.fillto/100*380; r.setAttribute('y',380-h); r.setAttribute('height',h); });
    if(e.target.classList.contains('dfig')) drawFigure(e.target);
  }});},{rootMargin:'0px 0px -12% 0px'});
  document.querySelectorAll('.rv,.dfig,.chipstrip,.jobcard,.invoice,.stackfr').forEach(x=>io.observe(x));
}

  const cursor=svg.querySelector('.desc-cursor');
  const APEX=70, BOT=1010;
  edges.forEach(p=>{ const L=p.getTotalLength(); p.dataset.len=L; p.style.strokeDasharray=L; p.style.strokeDashoffset=L; });
  const showAll=()=>{ edges.forEach(p=>{p.style.strokeDashoffset=0;}); if(rect) rect.setAttribute('height',1070); marks.forEach(m=>m.classList.add('on')); };
  if(!SCRUB){ track.classList.add('static'); showAll(); return; }
  track.classList.add('scrubbing');
  const fmt=prog=>{ if(prog<0.02) return 'surface'; const d=Math.round(prog*4000/50)*50; return '−'+d.toLocaleString()+' m'; };
  Motion.scroll((p,info)=>{
    const prog = typeof p==='number' ? p : (info&&info.y?info.y.progress:(p&&p.y&&typeof p.y.progress==='number'?p.y.progress:0));
    const e=Math.min(1, prog/0.9);
    edges.forEach(pp=>{ const L=+pp.dataset.len; pp.style.strokeDashoffset=L*(1-e); });
    if(rect) rect.setAttribute('height', APEX + e*(1070-APEX));
    const cy=APEX + prog*(BOT-APEX);
    if(cursor){ cursor.setAttribute('transform','translate(0,'+cy+')'); const t=cursor.querySelector('.dc-tag'); if(t) t.textContent=fmt(prog); }
    marks.forEach(m=>m.classList.toggle('on', cy >= (+m.dataset.y)-6));
  }, {target:track, offset:['start start','end end']});
}

/* ===== Motion enhancement layer (motion.dev) ===== */
const MOK = !REDUCED && !!(window.Motion && window.Motion.animate);
function mCommit(el, props){ props.forEach(p=>{ try{ el.style[p]=''; }catch(e){} }); }
function animIn(el, kf, opt, revert){
  let a; try{ a=Motion.animate(el, kf, opt); }catch(e){ mCommit(el,revert); return; }
  const done=()=>mCommit(el,revert);
  if(a && a.finished && a.finished.then) a.finished.then(done, done);
  else setTimeout(done, ((opt.delay||0)+(opt.duration||1))*1000+80);
}
function drawFigure(scope){
  if(!MOK) return;
  const paths=scope.querySelectorAll('.dg-flow,.dg-flow-g,.dg-line');
  let i=0;
  paths.forEach(p=>{
    let L; try{ L=p.getTotalLength(); }catch(e){ return; }
    if(!L || L>3000) return;
    p.style.strokeDasharray=L; p.style.strokeDashoffset=L;
    animIn(p, {strokeDashoffset:[L,0]}, {duration:1.0, delay:0.2+i*0.13, ease:[0.4,0,0.2,1]}, ['strokeDasharray','strokeDashoffset']);
    i++;
  });
}
function heroIntro(){
  if(!MOK) return;
  const txt=document.querySelector('.bleed-txt'); if(!txt) return;
  [...txt.children].forEach((k,i)=>{
    k.style.opacity='0';
    animIn(k, {opacity:[0,1], transform:['translateY(22px)','translateY(0px)'], filter:['blur(10px)','blur(0px)']},
      {duration:1.05, delay:0.25+i*0.17, ease:[0.2,0.7,0.2,1]}, ['opacity','transform','filter']);
  });
}

function initSeaSnow(){
  if(REDUCED) return;
  const cv=document.createElement('canvas'); cv.id='seasnow'; cv.setAttribute('aria-hidden','true');
  document.body.appendChild(cv);
  const ctx=cv.getContext('2d'); const DPR=Math.min(2, window.devicePixelRatio||1);
  let W=0,H=0,parts=[];
  const clamp=(v,a,b)=>v<a?a:v>b?b:v;
  const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
  const mk=()=>({x:Math.random()*W, y:Math.random()*H, r:(Math.random()*1.5+0.4)*DPR,
    s:(Math.random()*0.16+0.04)*DPR, sway:Math.random()*0.7+0.2, ph:Math.random()*6.28, glow:Math.random()<0.14});
  function resize(){ W=cv.width=Math.floor(innerWidth*DPR); H=cv.height=Math.floor(innerHeight*DPR);
    cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
    const n=clamp(Math.round(innerWidth/15),44,120); parts=Array.from({length:n},mk); }
  function frame(t){
    const max=document.documentElement.scrollHeight-innerHeight;
    const prog=max>0?clamp(window.pageYOffset/max,0,1):0;
    // visible below the pale surface, gone before the light coda
    const vis=smooth(0.05,0.15,prog)*(1-smooth(0.85,0.95,prog));
    ctx.clearRect(0,0,W,H);
    if(vis>0.002){
      for(const p of parts){
        p.y-=p.s; p.x+=Math.sin(t*0.0004*p.sway+p.ph)*0.16*DPR;
        if(p.y<-4){ p.y=H+4; p.x=Math.random()*W; }
        const base=vis*(0.09+0.26*(p.r/(2*DPR)));
        if(p.glow && prog>0.5){
          const g=vis*smooth(0.5,0.8,prog)*0.7;
          ctx.fillStyle='rgba(120,200,224,'+(base+g).toFixed(3)+')';
          ctx.beginPath(); ctx.arc(p.x,p.y,p.r*1.7,0,6.283); ctx.fill();
        } else {
          ctx.fillStyle='rgba(203,222,236,'+base.toFixed(3)+')';
          ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill();
        }
      }
    }
    requestAnimationFrame(frame);
  }
  resize(); addEventListener('resize',resize); requestAnimationFrame(frame);
}

/* ================= boot ================= */
renderAll();
heroIntro();
initSeaSnow();
buildGauge();
measure();
initIO();
initDescent();
addEventListener('scroll',onScroll,{passive:true});
addEventListener('resize',()=>{measure();onScroll();});
setTimeout(()=>{measure();onScroll();},400);
onScroll();
if(location.hash){ const target=document.getElementById(decodeURIComponent(location.hash.slice(1))); if(target) setTimeout(()=>target.scrollIntoView({behavior:'auto',block:'start'}),120); }
})();
</script>
