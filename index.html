<meta name="description" content="You've just stolen the money. That was the easy part. A guided descent through the hidden architecture of money laundering, from phishing texts to banks that stopped being banks.">
<style>
:root{
  --navy:#0B1626;
  --abyss:#04070E;
  --bone:#EDE8DF;
  --ice:#7FB3D5;
  --ice-soft:#A9CCE3;
  --green:#3E7C4F;
  --green-soft:#5DA271;
  --danger:#C96F5F;
  --ink:#E7E4DB;
  --ink-dim:#9FAEBE;
  --ink-faint:#5F7186;
  --line:rgba(127,179,213,.16);
  --line-2:rgba(127,179,213,.30);
  --card:rgba(127,179,213,.055);
  --frame:rgba(9,18,32,.55);
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:'SF Mono',SFMono-Regular,ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace;
}
.zone-light{
  --ink:#1C2634;
  --ink-dim:#46586C;
  --ink-faint:#7D8B9B;
  --ice:#2E5F82;
  --ice-soft:#24506F;
  --green-soft:#2F6B45;
  --line:rgba(11,22,38,.16);
  --line-2:rgba(11,22,38,.30);
  --card:rgba(11,22,38,.045);
  --frame:rgba(11,22,38,.05);
  color:var(--ink);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bone);color:var(--ink);
  font-family:var(--serif);font-size:20px;line-height:1.75;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
::selection{background:var(--ice);color:#0B1626}
a{color:var(--ice-soft);text-decoration:none;border-bottom:1px solid rgba(127,179,213,.35)}
a:hover{border-bottom-color:var(--ice-soft)}
.zone-light a{color:#2E5F82;border-bottom-color:rgba(46,95,130,.35)}

.reading{max-width:1180px;margin:0 auto;padding:0 32px}
.col{max-width:680px;margin:0 auto}
.essay p{margin:0 0 1.4em}
.essay p.first{text-indent:0}
.essay p+p{text-indent:1.4em}
.essay p.first+p,.essay h3+p,.callout+p,figure+p,.dfig+p,.chipstrip+p,.plant+p,.holdline+p{text-indent:0}
.essay b,.essay strong{color:var(--ice-soft);font-weight:600}
.zone-light .essay b,.zone-light .essay strong{color:#24506F}

.dropcap::first-letter{
  font-size:4.4em;line-height:.82;float:left;padding:8px 14px 0 0;
  font-weight:600;color:var(--ice);font-family:var(--serif);
}

/* ---------- depth gauge (desktop) ---------- */
#gauge{position:fixed;left:22px;top:50%;transform:translateY(-50%);z-index:40;width:104px;user-select:none}
#gauge svg{width:100%;height:auto;display:block;overflow:visible}
#gauge .g-ice{fill:rgba(127,179,213,.10);stroke:rgba(127,179,213,.45);stroke-width:1}
#gauge .g-water{stroke:var(--ice);stroke-width:1;stroke-dasharray:3 4;opacity:.6}
#gauge .g-tick{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;fill:var(--ink-faint);cursor:pointer}
#gauge .g-tick:hover{fill:var(--ice-soft)}
#gauge .g-tick.on{fill:var(--ice)}
#gauge .g-marker{fill:var(--ice);stroke:rgba(127,179,213,.4);stroke-width:4}
@media(max-width:1180px){#gauge{display:none}}

/* ---------- mobile progress bar ---------- */
#mprog{display:none;position:fixed;top:0;left:0;right:0;height:26px;z-index:50;background:linear-gradient(180deg,rgba(4,7,14,.85),rgba(4,7,14,0));pointer-events:none}
#mprog .mp-bar{position:absolute;top:0;left:0;height:3px;width:0;background:var(--ice)}
#mprog .mp-tick{position:absolute;top:0;width:1px;height:7px;background:rgba(127,179,213,.5)}
@media(max-width:1180px){#mprog{display:block}}

/* ---------- section heads ---------- */
.zone{position:relative;padding:10vh 0 2vh}
.zone-head{text-align:center;margin-bottom:6vh;padding:0 20px}
.zone-kicker{font-family:var(--mono);font-size:12px;letter-spacing:.4em;color:var(--ice);text-transform:uppercase}
.zone-depth{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--ink-faint);margin-top:10px;text-transform:uppercase}
.zone-head h2{font-family:var(--serif);font-weight:500;font-size:clamp(32px,5vw,56px);letter-spacing:-.01em;margin:16px auto 12px;line-height:1.08;max-width:22ch}
.zone-head .zone-def{font-family:var(--serif);font-style:italic;color:var(--ink-dim);font-size:19px;max-width:40ch;margin:0 auto}
.zone-rule{width:64px;height:1px;background:var(--ice);margin:24px auto 0;opacity:.7}
.essay h3{font-family:var(--serif);font-weight:600;font-size:26px;letter-spacing:-.01em;margin:2.4em 0 .7em;line-height:1.2}

/* rule stamp (motif #1) */
.stamp{margin:3em auto 2.6em;text-align:center}
.stamp span{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:8px 18px}
.stamp b{color:var(--ice);font-weight:400}
.motifcard{min-height:92vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:10vh 24px}
.motifcard .mc-k{font-family:var(--mono);font-size:12px;letter-spacing:.34em;color:var(--ice);text-transform:uppercase;margin-bottom:30px}
.motifcard h3{font-family:var(--serif);font-weight:500;font-size:clamp(30px,4.6vw,54px);line-height:1.25;max-width:22ch;margin:0 auto}
.motifcard h3 em{color:var(--ice-soft);font-style:italic}
.motifcard .mc-s{font-family:var(--sans);font-size:15px;color:var(--ink-dim);margin:26px auto 0;max-width:46ch;text-align:center}

/* ---------- pinned tracks ---------- */
.pin-track{position:relative}
.pin-sticky{position:sticky;top:0;height:100vh;overflow:hidden}
.bleed .pin-sticky{display:flex;align-items:center;justify-content:center}
.bleed-art{position:absolute;inset:0;overflow:hidden}
.bleed-art svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) translateY(calc(var(--p,0)*-5%));min-width:100%;height:118%}
.bleed-art.tall svg{top:0;transform:translate(-50%,calc(var(--p,0)*-36%));height:210%;width:auto;min-width:100%}
.bleed-veil{position:absolute;inset:0;pointer-events:none}
.bleed-txt{position:relative;z-index:3;text-align:center;padding:0 26px;max-width:820px}
.bleed-txt .bk{font-family:var(--mono);font-size:12px;letter-spacing:.34em;text-transform:uppercase;margin-bottom:26px;color:var(--ice)}
.bleed-txt h2,.bleed-txt h1{font-family:var(--serif);font-weight:500;letter-spacing:-.015em;line-height:1.06;font-size:clamp(40px,7vw,86px)}
.bleed-txt .bs{font-family:var(--serif);font-style:italic;font-size:clamp(18px,2.2vw,25px);margin-top:24px;line-height:1.5}
.bleed-txt .bb{margin-top:40px;font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase}
.scrollcue{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);z-index:3;font-family:var(--mono);font-size:10px;letter-spacing:.3em;text-transform:uppercase;opacity:.75;animation:cueFloat 2.4s ease-in-out infinite}
@keyframes cueFloat{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(7px)}}
.plate-tag{position:absolute;right:16px;bottom:14px;z-index:3;font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:rgba(127,179,213,.5)}

/* pinned stepped diagrams */
.pinned-dg .pin-sticky{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:40px 20px 48px}
.pinned-dg .pd-title{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ice)}
.pinned-dg .pd-frame{width:min(860px,94vw);background:var(--frame);border:1px solid var(--line);border-radius:12px;padding:26px 24px}
.pinned-dg svg{width:100%;height:auto;display:block;overflow:visible}
.pinned-dg .pd-frame svg{max-height:calc(100vh - 330px);min-height:180px}
.imgnote{margin:2.4em auto;max-width:640px;border:1px dashed var(--line-2);border-radius:12px;padding:22px 24px;background:rgba(127,179,213,.04)}
.imgnote .in-k{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ice);margin-bottom:10px}
.imgnote .in-t{font-family:var(--serif);font-size:18px;color:var(--ink);margin-bottom:10px}
.imgnote .in-s{font-family:var(--sans);font-size:14px;line-height:1.6;color:var(--ink-dim)}
.imgnote .in-s b{color:var(--ink)}
.pcaps{position:relative;width:min(620px,92vw);min-height:86px}
.pcap{position:absolute;inset:0;opacity:0;transform:translateY(8px);transition:opacity .45s ease,transform .45s ease;text-align:center;font-family:var(--sans);font-size:15.5px;line-height:1.55;color:var(--ink-dim)}
.pcap b{color:var(--ink)}
.pcap.on{opacity:1;transform:none}
.pd-dots{display:flex;gap:8px;justify-content:center}
.pd-dots i{width:6px;height:6px;border-radius:50%;background:rgba(127,179,213,.25)}
.pd-dots i.on{background:var(--ice)}
/* stacked fallback frames */
.stackfr{margin:2.6em auto;max-width:760px}
.stackfr .pd-frame{background:var(--frame);border:1px solid var(--line);border-radius:12px;padding:22px 18px}
.stackfr figcaption{font-family:var(--sans);font-size:14.5px;color:var(--ink-dim);text-align:center;margin-top:12px;line-height:1.55;max-width:52ch;margin-left:auto;margin-right:auto}
.stackfr svg{width:100%;height:auto;display:block;overflow:visible}

/* step-state machinery: elements tagged .s0/.s1/.s2/.s3 appear from that step on */
[data-step] .s0,[data-step] .s1,[data-step] .s2,[data-step] .s3{opacity:0;transition:opacity .6s ease}
[data-step="0"] .s0,
[data-step="1"] .s0,[data-step="1"] .s1,
[data-step="2"] .s0,[data-step="2"] .s1,[data-step="2"] .s2,
[data-step="3"] .s0,[data-step="3"] .s1,[data-step="3"] .s2,[data-step="3"] .s3{opacity:1}
/* elements that vanish after their step */
[data-step="1"] .x0,[data-step="2"] .x0,[data-step="3"] .x0{opacity:0!important}
[data-step="2"] .x1,[data-step="3"] .x1{opacity:0!important}
[data-step="3"] .x2{opacity:0!important}
/* grey-out hook (Jurado collapse) */
[data-step="3"] .greyable{filter:grayscale(1);opacity:.4!important;transition:filter .8s ease,opacity .8s ease}

/* ---------- diagram/chart figure shells ---------- */
.dfig{margin:3em auto;max-width:780px}
.dfig .d-title{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ice);margin-bottom:6px;text-align:center}
.dfig .d-frame{background:var(--frame);border:1px solid var(--line);border-radius:10px;padding:28px 24px}
.dfig svg{width:100%;height:auto;display:block;overflow:visible}
.dfig figcaption{font-family:var(--sans);font-size:14px;color:var(--ink-faint);text-align:center;margin-top:14px;line-height:1.55;max-width:56ch;margin-left:auto;margin-right:auto}
.dg-box{fill:rgba(127,179,213,.05);stroke:var(--line-2)}
.dg-box-ice{fill:rgba(127,179,213,.13);stroke:var(--ice)}
.dg-box-dirty{fill:rgba(62,124,79,.16);stroke:var(--green-soft)}
.dg-box-danger{fill:rgba(201,111,95,.13);stroke:var(--danger)}
.dg-t{font-family:var(--sans);fill:var(--ink);font-size:13px;font-weight:600}
.dg-t-sm{font-family:var(--mono);fill:var(--ink-dim);font-size:10.5px;letter-spacing:.04em}
.dg-t-lbl{font-family:var(--mono);fill:var(--ink-faint);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase}
.dg-line{stroke:var(--line-2);stroke-width:1.5;fill:none}
.dg-flow{stroke:var(--ice);stroke-width:1.6;fill:none;opacity:.8}
.dg-flow-g{stroke:var(--green-soft);stroke-width:1.6;fill:none;opacity:.85}
.dg-dash{stroke:var(--danger);stroke-width:1.2;stroke-dasharray:5 5;fill:none;opacity:.7}
.dg-coin{fill:var(--green-soft)}
.dg-anim{opacity:0}
.dfig.in .dg-anim{opacity:1;transition:opacity .6s ease}
.dfig.in .dg-anim.d1{transition-delay:.5s}
.dfig.in .dg-anim.d2{transition-delay:1.1s}
.dfig.in .dg-anim.d3{transition-delay:1.8s}
.dfig.in .dg-anim.d4{transition-delay:2.6s}

/* bar rows */
.bar-row{margin:0 0 22px}
.bar-row:last-child{margin-bottom:0}
.bar-row .bl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:14px}
.bar-row .bl .bname{font-family:var(--sans);font-size:14.5px;color:var(--ink)}
.bar-row .bl .bval{font-family:var(--mono);font-size:15px;color:var(--ice-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar-track{height:26px;background:rgba(127,179,213,.07);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;width:0;border-radius:4px;transition:width 1.1s cubic-bezier(.2,.8,.25,1)}
.in .bar-fill,.pin-sticky .bar-fill{width:var(--w)}
.bar-fill.ice{background:linear-gradient(90deg,var(--ice),var(--ice-soft))}
.bar-fill.muted{background:rgba(159,174,190,.35)}
.bar-fill.green{background:linear-gradient(90deg,var(--green),var(--green-soft))}
.bar-fill.danger{background:linear-gradient(90deg,var(--danger),#E08A7B)}

/* ---------- big counters ---------- */
.bignum{margin:2.6em auto;text-align:center;padding:34px 20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.bignum .bn-v{font-family:var(--serif);font-weight:600;font-size:clamp(52px,9vw,118px);line-height:1;color:var(--ice);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bignum .bn-l{font-family:var(--sans);font-size:15px;color:var(--ink-dim);max-width:44ch;margin:14px auto 0;line-height:1.5}
.bignum.green .bn-v{color:var(--green-soft)}
.bignum.danger .bn-v{color:var(--danger)}
.counter-row{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:2.6em 0}

/* ---------- stat chips ---------- */
.chipstrip{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:2.8em auto}
.chip{flex:1 1 180px;max-width:240px;background:var(--frame);border:1px solid var(--line);border-radius:10px;padding:22px 18px;text-align:center;opacity:0;transform:scale(.92) translateY(10px)}
.chipstrip.in .chip{opacity:1;transform:none;transition:opacity .5s ease,transform .5s cubic-bezier(.2,.9,.3,1.4)}
.chipstrip.in .chip:nth-child(2){transition-delay:.18s}
.chipstrip.in .chip:nth-child(3){transition-delay:.36s}
.chip .cv{font-family:var(--serif);font-weight:600;font-size:clamp(26px,3.4vw,38px);color:var(--ice);line-height:1.1;letter-spacing:-.01em}
.chip .cl{font-family:var(--sans);font-size:13px;color:var(--ink-dim);margin-top:9px;line-height:1.45}

/* ---------- typographic set pieces ---------- */
.plant{margin:3.2em auto;text-align:center;padding:30px 16px}
.plant .pv{font-family:var(--serif);font-weight:600;font-size:clamp(56px,10vw,132px);letter-spacing:-.025em;line-height:1;color:var(--green-soft)}
.plant .pl{font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-faint);margin-top:18px;text-indent:.22em}
.holdline{min-height:96vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 26px}
.holdline p{font-family:var(--serif);font-weight:500;font-size:clamp(34px,5.4vw,64px);line-height:1.2;max-width:18ch;margin:0;color:var(--ink)}
.holdline p b{color:var(--danger);font-weight:500}

/* ---------- image placeholder slots ---------- */
.img-slot{margin:3em auto;max-width:820px}
.img-slot.sq{max-width:520px}
.img-slot .art{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:
  radial-gradient(120% 90% at 50% 0%,rgba(127,179,213,.10),rgba(11,22,38,0) 55%),
  linear-gradient(180deg,#101E33,#060C18)}
.img-slot .art svg{position:absolute;inset:0;width:100%;height:100%}
.img-slot .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.img-slot.loaded .art img{display:block}
.img-slot.loaded .art svg,.img-slot.loaded .plate{display:none}
.img-slot .plate{position:absolute;left:14px;bottom:12px;font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:rgba(127,179,213,.55)}
.img-slot figcaption{font-family:var(--sans);font-size:14px;color:var(--ink-faint);margin-top:12px;line-height:1.55;text-align:center;max-width:56ch;margin-left:auto;margin-right:auto}
/* ---------- photo evidence slots: real photographs graded into the palette ----------
   Two stacked copies of the same photo: colour original under, duotoned copy on top.
   filter:url() cannot be transitioned, so the reveal fades the top layer's opacity. */
.img-slot.photo .art img.duo{filter:contrast(1.12) brightness(.93) url(#duo-ice);transition:opacity .55s ease}
.img-slot.photo .art::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(115% 92% at 50% 42%, rgba(11,22,38,0) 52%, rgba(11,22,38,.45) 100%);transition:opacity .55s ease}
.img-slot.photo.exhibit .art::after{opacity:1}
.img-slot.photo.exhibit .art::before{content:"";position:absolute;inset:10px;pointer-events:none;z-index:1;background-image:
  linear-gradient(rgba(127,179,213,.65),rgba(127,179,213,.65)),linear-gradient(rgba(127,179,213,.65),rgba(127,179,213,.65)),
  linear-gradient(rgba(127,179,213,.65),rgba(127,179,213,.65)),linear-gradient(rgba(127,179,213,.65),rgba(127,179,213,.65)),
  linear-gradient(rgba(127,179,213,.65),rgba(127,179,213,.65)),linear-gradient(rgba(127,179,213,.65),rgba(127,179,213,.65)),
  linear-gradient(rgba(127,179,213,.65),rgba(127,179,213,.65)),linear-gradient(rgba(127,179,213,.65),rgba(127,179,213,.65));
  background-repeat:no-repeat;
  background-size:12px 1px,1px 12px,12px 1px,1px 12px,12px 1px,1px 12px,12px 1px,1px 12px;
  background-position:top left,top left,top right,top right,bottom left,bottom left,bottom right,bottom right}
.img-slot.photo.exhibit .plate{display:block;z-index:2}
.img-slot.photo .credit{display:none;position:absolute;right:14px;bottom:12px;z-index:2;font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:rgba(127,179,213,.62);transition:color .55s ease}
.img-slot.photo.exhibit .credit{display:block}
.img-slot.photo.exhibit .plate,.img-slot.photo .credit{background:rgba(8,14,24,.6);padding:3px 8px;border-radius:4px}
@media(hover:hover){
  .img-slot.photo .art:hover img.duo{opacity:0}
  .img-slot.photo .art:hover::after{opacity:0}
  .img-slot.photo .art:hover .credit{color:rgba(237,232,223,.85)}
}
@media(prefers-reduced-motion:reduce){.img-slot.photo .art img.duo,.img-slot.photo .art::after,.img-slot.photo .credit{transition:none}}
/* ---------- x-ray reveal (slot b): ordinary wall, one sweep, then the exhibit ---------- */
.img-slot.xray.loaded .art svg{display:block}
.img-slot.xray .art img{opacity:0;transition:opacity .9s ease}
.img-slot.xray.done .art img{opacity:1}
.img-slot.xray .xrev{position:absolute;inset:0;clip-path:inset(0 92% 0 8%)}
.img-slot.xray .xline{position:absolute;top:0;bottom:0;width:2px;left:8%;opacity:0;background:rgba(127,179,213,.95);box-shadow:0 0 16px 4px rgba(127,179,213,.45);pointer-events:none}
.img-slot.xray.scanning .xrev{animation:xsweep 1.1s linear 1 alternate}
.img-slot.xray.scanning .xline{animation:xliner 1.1s linear 1 alternate;opacity:1}
@keyframes xsweep{from{clip-path:inset(0 70% 0 8%)}to{clip-path:inset(0 8% 0 70%)}}
@keyframes xliner{from{left:30%}to{left:92%}}
.img-slot.xray .xreplay{display:none;position:absolute;right:14px;top:12px;z-index:3;cursor:pointer;border:1px solid var(--line);background:rgba(8,14,24,.6);color:rgba(127,179,213,.75);font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;padding:3px 8px;border-radius:4px}
.img-slot.xray.done .xreplay{display:block}
.img-slot.xray .art[role="link"]{cursor:pointer}
@keyframes xpulse{0%,100%{opacity:.5}50%{opacity:1}}
.img-slot.xray .xpulse{transform-box:fill-box;animation:xpulse 3.4s ease-in-out infinite;filter:drop-shadow(0 0 6px rgba(201,111,95,.55))}
@media(prefers-reduced-motion:reduce){.img-slot.xray .xpulse,.img-slot.xray .xrev,.img-slot.xray .xline{animation:none}.img-slot.xray .art img{transition:none}}
.ph-motif{stroke:rgba(127,179,213,.32);fill:none;stroke-width:1.2}
.ph-motif-f{fill:rgba(127,179,213,.09);stroke:rgba(127,179,213,.26);stroke-width:1.1}
.ph-acc{stroke:rgba(162,214,247,.6);fill:none;stroke-width:1.4}
.ph-acc-f{fill:rgba(162,214,247,.18);stroke:rgba(162,214,247,.42);stroke-width:1.1}
.img-slot .ph-g .ph-motif-f,.img-slot .ph-g .ph-acc-f{filter:drop-shadow(0 0 5px rgba(127,179,213,.22))}
@keyframes spglow{0%,100%{opacity:.62;transform:scale(.97)}50%{opacity:1;transform:scale(1.05)}}
.img-slot .sp-glow{transform-box:fill-box;transform-origin:center;animation:spglow 7.5s ease-in-out infinite}
@keyframes spmote{0%{transform:translateY(8px);opacity:0}22%{opacity:.6}100%{transform:translateY(-16px);opacity:0}}
.img-slot .sp-mote{animation:spmote 10s linear infinite}
.img-slot .sp-mote.m1{animation-duration:13s;animation-delay:-4s}
.img-slot .sp-mote.m2{animation-duration:8s;animation-delay:-2s}
.img-slot .sp-mote.m3{animation-duration:15s;animation-delay:-7s}
.ph-flag{stroke:var(--danger);fill:none;stroke-width:1.5}
.ph-flag-f{fill:rgba(201,111,95,.16);stroke:var(--danger);stroke-width:1.2}
.img-slot .ph-g .ph-flag,.img-slot .ph-g .ph-flag-f{filter:drop-shadow(0 0 5px rgba(201,111,95,.45))}
@keyframes flagpulse{0%,100%{opacity:.72}50%{opacity:1}}
.img-slot .ph-flag,.img-slot .ph-flag-f{animation:flagpulse 3.2s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.img-slot .sp-glow,.img-slot .sp-mote,.img-slot .ph-flag,.img-slot .ph-flag-f{animation:none}}
@keyframes panoglow{0%,100%{opacity:.5}50%{opacity:.9}}
.pano .pano-lit{animation:panoglow 4.2s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.pano .pano-lit{animation:none}}

/* ---------- panorama ---------- */
.pano{margin:3em 0}
.pano .pano-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.pano .pano-inner{width:250%;min-width:1600px}
.pano .art{position:relative;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0F1D31,#070E1B)}
.pano .art svg{display:block;width:100%;height:auto}
.pano .hint{font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-faint);text-align:center;margin-top:10px}
.pano figcaption{font-family:var(--sans);font-size:14px;color:var(--ink-faint);text-align:center;margin-top:6px;line-height:1.55}

/* ---------- job card ---------- */
.jobcard{margin:2.8em auto;max-width:520px;background:var(--frame);border:1px solid var(--line);border-radius:10px;padding:26px 28px;font-family:var(--sans)}
.jobcard .jc-k{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--green-soft);margin-bottom:12px}
.jobcard h4{font-family:var(--serif);font-size:23px;font-weight:600;color:var(--ink);margin-bottom:2px}
.jobcard .jc-pay{font-family:var(--mono);font-size:13px;color:var(--ice-soft);margin-bottom:16px}
.jobcard ul{list-style:none}
.jobcard li{position:relative;font-size:14.5px;color:var(--ink-dim);padding:7px 0;border-bottom:1px dashed var(--line)}
.jobcard li:last-child{border-bottom:none}
.jobcard li .redact{position:absolute;inset:6px -4px;background:#0A1220;border-radius:3px;transform:scaleX(0);transform-origin:left}
.jobcard.in li .redact{transform:scaleX(1);transition:transform .5s ease}
.jobcard.in li:nth-child(1) .redact{transition-delay:.9s}
.jobcard.in li:nth-child(2) .redact{transition-delay:1.5s}
.jobcard.in li:nth-child(3) .redact{transition-delay:2.1s}
.jobcard li.keep{color:var(--ink);font-weight:600}
.jobcard .jc-note{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-top:14px;opacity:0}
.jobcard.in .jc-note{opacity:1;transition:opacity .5s ease 2.8s}

/* ---------- invoice ---------- */
.invoice{margin:2.8em auto;max-width:500px;background:#F4F1E9;color:#22303F;border-radius:6px;padding:30px 32px;font-family:var(--mono);font-size:13px;box-shadow:0 24px 60px -28px rgba(0,0,0,.7)}
.invoice .iv-h{display:flex;justify-content:space-between;border-bottom:2px solid #22303F;padding-bottom:10px;margin-bottom:16px;letter-spacing:.18em;font-size:11px}
.invoice .iv-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dotted rgba(34,48,63,.3)}
.invoice .iv-tot{display:flex;justify-content:space-between;padding-top:14px;font-size:16px;font-weight:700}
.invoice .amt{position:relative}
.invoice .amt .round-v{color:#B23A2E;transition:opacity .4s ease}
.invoice .amt .real-v{position:absolute;right:0;top:0;opacity:0;color:#2F6B45;white-space:nowrap}
.invoice.in .round-v{opacity:0;transition-delay:1.6s;text-decoration:line-through}
.invoice.in .real-v{opacity:1;transition:opacity .4s ease 1.6s}
.invoice .iv-stamp{margin-top:18px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#8A6A1F;opacity:0}
.invoice.in .iv-stamp{opacity:1;transition:opacity .5s ease 2.4s}
.iv-callback{font-family:var(--sans);font-size:14.5px;color:var(--ink-dim);text-align:center;max-width:46ch;margin:16px auto 0}
.iv-callback b{color:var(--green-soft)}

/* ---------- annotated leaked-manual exhibit ---------- */
.manualdoc{margin:3.2em auto;max-width:940px}
.manualdoc .md-cap{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ice);text-align:center;margin-bottom:12px}
.manualdoc .md-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px;align-items:start}
.manualdoc .md-paper{background:#EDE7D6;color:#2A2620;border-radius:4px;padding:30px 32px 34px;font-family:var(--mono);font-size:12.5px;line-height:1.72;box-shadow:0 26px 64px -30px rgba(0,0,0,.75);position:relative;overflow:hidden}
.manualdoc .md-paper::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 27px,rgba(42,38,32,.05) 27px,rgba(42,38,32,.05) 28px);pointer-events:none}
.manualdoc .md-chrome{display:flex;justify-content:space-between;align-items:center;border-bottom:1.5px solid rgba(42,38,32,.4);padding-bottom:9px;margin-bottom:16px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#7A6A4E}
.manualdoc .md-redact{background:#2A2620;color:#2A2620;border-radius:1px;padding:0 6px;user-select:none}
.manualdoc .md-h{font-weight:700;font-size:13.5px;letter-spacing:.04em;margin:0 0 12px;color:#20303F}
.manualdoc .md-paper p{margin:0 0 11px;text-indent:0}
.manualdoc .md-paper .li{padding-left:14px;text-indent:-14px}
.manualdoc .md-hl{background:linear-gradient(transparent 58%,rgba(201,164,95,.55) 58%);border-radius:1px;cursor:pointer;transition:background .2s ease;position:relative}
.manualdoc .md-hl sup{font-family:var(--sans);font-size:9px;font-weight:700;color:#8A5A1F;padding:0 2px;vertical-align:super}
.manualdoc .md-hl.lit{background:linear-gradient(transparent 20%,rgba(201,111,95,.5) 20%)}
.manualdoc .md-notes{display:flex;flex-direction:column;gap:14px;padding-top:2px}
.manualdoc .md-note{border-left:2px solid var(--line);padding:2px 0 2px 15px;cursor:pointer;transition:border-color .2s ease}
.manualdoc .md-note.lit{border-left-color:var(--danger)}
.manualdoc .md-note .mn-k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ice);display:flex;gap:8px;align-items:baseline;margin-bottom:5px}
.manualdoc .md-note .mn-n{display:inline-flex;width:17px;height:17px;border-radius:50%;background:rgba(201,164,95,.16);color:var(--green-soft);font-family:var(--sans);font-size:10px;font-weight:700;align-items:center;justify-content:center;flex:0 0 auto}
.manualdoc .md-note.lit .mn-n{background:rgba(201,111,95,.18);color:var(--danger)}
.manualdoc .md-note p{font-family:var(--sans);font-size:14px;line-height:1.55;color:var(--ink-dim);margin:0;text-indent:0}
.manualdoc .md-note p b{color:var(--ink)}
.manualdoc figcaption{font-family:var(--sans);font-size:13.5px;color:var(--ink-faint);text-align:center;margin-top:16px;max-width:60ch;margin-left:auto;margin-right:auto}
@media(max-width:720px){
  .manualdoc .md-grid{grid-template-columns:1fr;gap:16px}
  .manualdoc .md-hl sup{color:#b06a1a}
}

/* ---------- live org chart ---------- */
.orgchart-fig .d-frame{padding:20px 14px}
.org-node{fill:rgba(127,179,213,.06);stroke:var(--line-2);stroke-width:1.1}
.org-fig{fill:var(--ice-soft);opacity:.8}
.org-fig-dark{fill:var(--ink-faint);opacity:.7}
.org-shell{fill:rgba(127,179,213,.05);stroke:var(--line-2);stroke-width:1.1}
.org-card{fill:rgba(9,18,32,.75);stroke:var(--line-2);stroke-width:1}
.org-conn{stroke:var(--line-2);stroke-width:1.1;fill:none}
.org-drop{stroke:var(--ice);stroke-width:1.1;stroke-dasharray:4 4;fill:none;opacity:.5}
.org-invoice{stroke:var(--ice);stroke-width:1;stroke-dasharray:2 4;fill:none;opacity:.5}
.org-lbl{font-family:var(--mono);fill:var(--ink-faint);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase}
.org-lbl.hi{fill:var(--ice)}
.org-badge{fill:rgba(62,124,79,.16);stroke:var(--green-soft);stroke-width:1}
.org-badge text{fill:var(--green-soft)}
.org-water{fill:rgba(127,179,213,.07);transform:scaleY(0);transform-origin:center bottom;transform-box:fill-box;transition:transform 1.2s cubic-bezier(.4,0,.2,1) 1.9s}
.dfig.in .org-water{transform:scaleY(1)}
.org-wave{stroke:var(--ice);stroke-width:1.3;fill:none;opacity:.55}
.org-caught-ring{stroke:var(--danger);stroke-width:1.5;stroke-dasharray:4 4;fill:none;opacity:0}
.org-cash{fill:var(--green-soft);opacity:.8}
.org-cash-red{fill:var(--danger)}
.dfig.in .org-caught-ring{opacity:.9;transition:opacity .6s ease 2.9s;animation:orgpulse 2.1s ease-in-out 3.5s infinite}
@keyframes orgpulse{0%,100%{opacity:.4}50%{opacity:.95}}
@media(prefers-reduced-motion:reduce){
  .org-water{transition:none;transform:scaleY(1)}
  .dfig.in .org-caught-ring{opacity:.9;animation:none}
}

/* ---------- coda descent map (Motion-scrubbed) ---------- */
.descent-track{position:relative;margin:0 auto}
.descent-sticky{position:sticky;top:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 14px}
.descent-track.static .descent-sticky{position:static;min-height:0;padding:40px 14px}
.descent-panel{width:min(940px,96vw);background:linear-gradient(180deg,#0B1725 0%,#060B14 55%,#03060C 100%);border:1px solid var(--line);border-radius:16px;padding:18px 8px 14px;box-shadow:0 50px 130px -55px #000}
.descent-panel .dp-h{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ice);text-align:center}
.descent-panel .dp-sub{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--ice-soft);text-align:center;margin-top:5px}
.descent-svg{width:100%;height:auto;display:block;margin-top:6px}
.desc-edge{fill:none;stroke:var(--ice);stroke-width:1.7;stroke-linejoin:round}
.desc-fill{opacity:.92}
.desc-wave{stroke:var(--ice-soft);stroke-width:1.4;fill:none;opacity:.55}
.desc-mark{opacity:0;transition:opacity .55s ease}
.desc-track.static .desc-mark,.descent-track.static .desc-mark{opacity:1}
.desc-mark.on{opacity:1}
.desc-mark .dm-dot{fill:var(--ice)}
.desc-mark.danger .dm-dot{fill:var(--danger)}
.desc-mark .dm-halo{fill:none;stroke:var(--ice);stroke-width:1;opacity:.35}
.desc-mark.danger .dm-halo{stroke:var(--danger)}
.desc-mark .dm-lead{stroke:var(--line-2);stroke-width:1;opacity:.55}
.desc-mark .dm-t{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;fill:var(--ice-soft)}
.desc-mark.danger .dm-t{fill:var(--danger)}
.desc-mark .dm-d{font-family:var(--mono);font-size:10.5px;fill:var(--ink-faint)}
.desc-mark .dm-s{font-family:var(--sans);font-size:12.5px;fill:var(--ink-dim)}
.desc-cursor{opacity:0}
.descent-track.scrubbing .desc-cursor{opacity:1}
.desc-cursor line{stroke:var(--danger);stroke-width:1;stroke-dasharray:2 5;opacity:.55}
.desc-cursor .dc-tag{font-family:var(--mono);font-size:10.5px;fill:var(--danger);letter-spacing:.1em}
.dp-hint{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);text-align:center;margin-top:2px;opacity:.75}
.descent-track.static .dp-hint{display:none}

/* ---------- marine snow (Deep-Sea descent atmosphere) ---------- */
#seasnow{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:4}
@media(prefers-reduced-motion:reduce){#seasnow{display:none}}

/* ---------- living iceberg: drifting god-rays + waterline shimmer ---------- */
@keyframes godray{0%,100%{opacity:.05;transform:translateX(-14px)}50%{opacity:.16;transform:translateX(14px)}}
.bleed-art .gray{animation:godray 15s ease-in-out infinite}
.bleed-art .gray.g1{animation-duration:19s;animation-delay:-5s}
.bleed-art .gray.g2{animation-duration:23s;animation-delay:-11s}
.bleed-art .gray.g3{animation-duration:17s;animation-delay:-8s}
@keyframes wshimmer{0%,100%{opacity:.35;stroke-dashoffset:0}50%{opacity:.6;stroke-dashoffset:22}}
.bleed-art .wshimmer{animation:wshimmer 9s ease-in-out infinite}
@keyframes facetglow{0%,100%{opacity:.9}50%{opacity:1}}
.bleed-art .facet{animation:facetglow 11s ease-in-out infinite}
/* glass: flickering monitor wall + trickling condensation */
@keyframes panelflick{0%,100%{opacity:.6}18%{opacity:.92}22%{opacity:.44}40%{opacity:.8}62%{opacity:.5}80%{opacity:.86}}
.bleed-art .flick{animation:panelflick 7s ease-in-out infinite}
.bleed-art .flick.f1{animation-duration:9.5s;animation-delay:-1.5s}
.bleed-art .flick.f2{animation-duration:6.2s;animation-delay:-3s}
.bleed-art .flick.f3{animation-duration:11s;animation-delay:-2.2s}
.bleed-art .flick.f4{animation-duration:8.3s;animation-delay:-4.1s}
.bleed-art .flick.f5{animation-duration:10.4s;animation-delay:-0.8s}
@keyframes drip{0%{stroke-dashoffset:0;opacity:0}9%{opacity:.9}90%{opacity:.9}100%{stroke-dashoffset:-660;opacity:0}}
.bleed-art .drip{stroke-dasharray:11 720;animation:drip 6.5s linear infinite}
.bleed-art .drip.d1{animation-duration:9s;animation-delay:-3s}
.bleed-art .drip.d2{animation-duration:7.5s;animation-delay:-5s}
.bleed-art .drip.d3{animation-duration:11s;animation-delay:-1.5s}
/* deep: pulsing bioluminescence + dissolving ice motes */
@keyframes biopulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.3)}}
.bleed-art .bio{transform-box:fill-box;transform-origin:center;animation:biopulse 5s ease-in-out infinite}
.bleed-art .bio.b1{animation-duration:7s;animation-delay:-2s}
.bleed-art .bio.b2{animation-duration:6s;animation-delay:-3.5s}
.bleed-art .bio.b3{animation-duration:8s;animation-delay:-1s}
@keyframes deepdrift{0%{opacity:0;transform:translateY(-8px)}35%{opacity:.55}100%{opacity:0;transform:translateY(34px)}}
.bleed-art .chunk{transform-box:fill-box;animation:deepdrift 13s ease-in infinite}
.bleed-art .chunk.c1{animation-duration:16s;animation-delay:-5s}
.bleed-art .chunk.c2{animation-duration:11s;animation-delay:-8s}
.bleed-art .chunk.c3{animation-duration:18s;animation-delay:-3s}
.bleed-art .chunk.c4{animation-duration:14.5s;animation-delay:-10s}
@media(prefers-reduced-motion:reduce){.bleed-art .gray,.bleed-art .wshimmer,.bleed-art .facet,.bleed-art .flick,.bleed-art .drip,.bleed-art .bio,.bleed-art .chunk{animation:none}}

/* ---------- callout / pullquote / terms / cites ---------- */
.callout{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--ice);border-radius:8px;padding:22px 26px;margin:2.2em 0}
.callout .c-k{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ice);margin-bottom:10px}
.callout p{font-family:var(--sans);font-size:16px;line-height:1.6;color:var(--ink-dim);margin:0;text-indent:0}
.callout b{color:var(--ink);font-weight:600}
.pullquote{border-left:2px solid var(--ice);padding:6px 0 6px 28px;margin:2.3em 0;font-family:var(--serif);font-style:italic;font-size:25px;line-height:1.42;color:var(--ice-soft)}
.pullquote cite{display:block;margin-top:14px;font-style:normal;font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--ink-faint)}
sup.cite{font-family:var(--sans);font-size:.62em;line-height:0;vertical-align:super;color:var(--ice);padding:0 1px}
sup.cite a{border:none;color:var(--ice)}
.term{border-bottom:1px dotted var(--green-soft);color:var(--ink);cursor:help;position:relative}
.term:hover,.term.open{color:var(--green-soft)}
.term .tip{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%) translateY(6px);
  width:min(280px,72vw);background:#0E1B2E;border:1px solid var(--line-2);border-radius:8px;
  padding:12px 14px;font-family:var(--sans);font-size:13.5px;line-height:1.5;color:var(--ink-dim);
  font-style:normal;text-indent:0;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;
  z-index:60;box-shadow:0 18px 40px -18px rgba(0,0,0,.85)}
.term .tip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#0E1B2E}
.term .tip b{color:var(--green-soft);font-weight:600}
.term:hover .tip,.term.open .tip{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- field guide ---------- */
#guide{padding:12vh 0 4vh;border-top:1px solid var(--line);margin-top:9vh}
.guide-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:40px;max-width:1000px;margin-left:auto;margin-right:auto}
.gtech{border:1px solid var(--line);border-radius:8px;background:var(--frame);overflow:hidden}
.gtech summary{list-style:none;cursor:pointer;padding:18px 22px;display:block;position:relative}
.gtech summary::-webkit-details-marker{display:none}
.gtech summary .gt-name{font-family:var(--serif);font-size:19px;color:var(--ink);display:block;padding-right:26px}
.gtech summary .gt-def{font-family:var(--sans);font-size:14px;color:var(--ink-dim);margin-top:5px;line-height:1.5;padding-right:26px}
.gtech summary::after{content:'+';position:absolute;right:22px;top:18px;color:var(--ice);font-family:var(--mono);font-size:18px}
.gtech[open] summary::after{content:'\2212'}
.gtech .gt-detail{padding:0 22px 22px;border-top:1px solid var(--line);margin-top:2px}
.gtech .gt-detail p{font-family:var(--sans);font-size:14.5px;line-height:1.6;color:var(--ink-dim);margin:14px 0 0;text-indent:0}
.gtech .gt-detail .gt-caught{border-left:2px solid var(--danger);padding-left:14px;color:var(--ink-faint);font-size:13.5px}
.gtech .gt-detail .gt-caught b{color:var(--danger)}

/* ---------- notes / reading / footer ---------- */
#notes{padding:12vh 0 8vh;border-top:1px solid var(--line);margin-top:6vh}
#notes h2{font-family:var(--serif);font-weight:500;font-size:34px;margin-bottom:8px}
#notes .n-sub{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:36px}
.reflist{list-style:none;counter-reset:ref}
.reflist li{counter-increment:ref;position:relative;padding:14px 0 14px 44px;border-bottom:1px solid var(--line);font-size:15.5px;color:var(--ink-dim);line-height:1.55}

<script type="application/json" id="methods">[{"id": "identity-theft", "name": "Stolen Identities & Fake Accounts", "summary": "Open bank accounts under someone else's name by harvesting stolen ID documents and defeating the bank's video checks.", "how": "Inside cybercrime Telegram channels, the investigation found e-books that are genuine laundering manuals. And most agree on step one: identity theft. Collecting ID photos is far easier than you'd think. A classic move is posting a fake apartment listing on an online marketplace and demanding a front-and-back passport scan from every applicant. A stolen ID alone won't beat a traditional bank, so the guides target neobanks, whose onboarding protocols they have examined under a microscope. Banks now require a live webcam 'Know Your Customer' video. Seemingly impossible to fake. The workaround: upload the stolen ID plus a selfie also harvested from the victim, then, instead of filming yourself, tell customer service your camera is broken. Support falls back to requesting a proof of address. The single easiest document to forge. Change the name and address on a utility bill, and you're in.", "caught": "The investigation only describes this trick because it has since been patched. The 'broken camera' loophole is closed. And the harvesting step has a simple antidote: watermark every copy of your ID documents so a scan is useless to a fraudster."}, {"id": "bank-drops", "name": "Bank Drops & Cash-Out", "summary": "Receive a fraudulent transfer into a throwaway 'bank drop' account and pull the money out as cash before the account is frozen.", "how": "A fraudulent transfer landing on a bank drop is only step one. The money cannot sit there, because within hours the banks will talk to each other and the account will be frozen. So scammers anticipate: they order debit cards in advance to pull cash out as fast as possible. The cards are never delivered to their own home. Instead they spot an empty flat or house on an estate agent's website, stick their name on its letterbox, and open it the way every postman and courier does. With a master key bought for about €15. Kept low-profile, the method can skim €2,000–3,000 a month in cash, and cash is untraceable: spend it quietly on daily life and nobody asks questions.", "caught": "The freeze race is the weak point. Banks now share fraud signals within hours. And the model doesn't scale: once business takes off, the piles of cash accumulating under the bed become their own problem, which is where the real laundering begins."}, {"id": "cash-burial", "name": "The Cash-Storage Problem", "summary": "Physical cash is the launderer's first headache. It rots, and depositing it triggers scrutiny.", "how": "Tempted to bury the surplus in the garden for retirement? Pablo Escobar, billionaire boss of the Medellín cartel, did exactly that at scale: he sent underlings to bury bags of cash across the four corners of Colombia, then had each one point out their stash on a map. So that he alone knew where every treasure lay. He also warehoused tonnes of banknotes. His brother later recounted what a disaster it was: humidity, insects and weather rotted the bills, and the rats alone nibbled away about 10% of the deposits. The alternative. Quietly injecting the cash into a bank account. Runs into a wall: banks watch cash deposits extremely closely and will quickly demand a document proving the money's origin, like a certificate from selling a piece of jewellery.", "caught": "At the slightest doubt, the bank files a 'suspicion report'. A note transmitted directly to France's anti-money-laundering agency, Tracfin. Storing cash loses value to rot and rats; depositing it invites the state in. Either way, raw cash is a trap."}, {"id": "structuring", "name": "Structuring (Smurfing)", "summary": "Break one large sum into many small deposits across many accounts to stay under the radar.", "how": "To counter deposit surveillance, criminals adopted a technique popularized by Escobar: smurfing. The idea is to fraction one large sum into a multitude of small payments over numerous accounts. Little smurfs of dirty money slipping under the radar. Typically, dealers would use their extended family to open hundreds of accounts and spread the deposits thin. For years it worked, because no single deposit was ever big enough to demand a justification.", "caught": "It doesn't work for long. In the case of one dealer, 'Farid', the investigating judge flagged 'an astonishingly strong and ever-increasing savings capacity' across twelve accounts held by his parents, roughly €490,000 flowing in as large-denomination cash, which the couple attributed to 'a modest lifestyle'. Their declared incomes (€14,000 in 2006, down to €6,300 in 2008) were so low they were often tax-exempt, yet money kept piling up. Today banks run powerful software specifically trained to spot smurfing patterns across accounts. The only real answer to deposit scrutiny is being able to justify the money's origin. Which is exactly what the next techniques manufacture."}, {"id": "fake-winnings", "name": "Fake Gambling Winnings", "summary": "Buy winning betting or lottery tickets from real winners to receive a legitimate-looking payout slip.", "how": "You can't tell the bank the truth about stolen money. So you manufacture a clean origin. This was the favourite method of the last French godfather, 'Francis le Belge': spend the day at the PMU betting shop, and when a punter hits a win, offer to buy his ticket for a small commission. Cash out the ticket yourself and you walk away with a magnificent official payout slip from the Française des Jeux. A state-certified explanation for your money. In 2017, investigators discovered a criminal gang had pushed the strategy to an industrial level: a network of roughly one hundred accomplices, each stationed in a betting shop, buying up winning tickets on demand.", "caught": "The industrial version made one fatal mistake: concentration. Every ticket the network bought was funnelled to a single bar-tabac in Aulnay-sous-Bois to be cashed. Week after week, that one shop was paying out winnings of several thousand euros. A statistical miracle that eventually became impossible not to notice."}, {"id": "fake-auctions", "name": "Rigged Art Auctions", "summary": "Put an artwork up for auction and have an accomplice overbid to justify a large 'sale'.", "how": "An even more efficient trick, good for ten times more money. Say you want to bank €90,000. First, put an art object. An antique cupboard, say. Up for auction. Then an accomplice joins the bidding and escalates to an absurd price nobody can match. After deducting the auctioneer's fee and the accomplice's commission, you can now justify a €90,000 deposit. And of course the cupboard never leaves your house. Look closely at recent art sales and some are very strange indeed: in 2014 a painting by Bilal estimated at €80,000 sold for €158,000; worse, in 2005 a mysterious owner listed the famous photograph 'Le Baiser de l'Hôtel de Ville', estimated at €20,000. It sold the next day for €184,960. Experts estimate the contemporary art market is overvalued by 20% purely because of laundering.", "caught": "Abuse is the danger: deposit large sums while officially earning little and a second watcher wakes up. The tax authority, which already runs algorithm suites over individuals hunting precisely for 'lifestyle anomalies'. The launderer's declared income must always be able to explain the money."}, {"id": "facade-business", "name": "Facade Businesses", "summary": "Run cash-heavy shops. Pizzerias, groceries, salons. And blend dirty money into the daily takings.", "how": "The diabolical method for making dirty money look earned: open a business that handles lots of cash and quietly fold your dirty money into the monthly takings. You don't even need real customers. The investigation filmed whole stretches of a single street where, within 25 metres, two groceries, a shisha bar, a takeaway grill, a tacos joint and yet another grocery all sat shuttered in the middle of the day, with no clients in sight. Run 'properly', the business demands double bookkeeping: a secret ledger separating dirty flows from clean ones, and an official set of accounts for the tax office and social-security collectors. Scale it up and you become a genuine criminal SME. Buying restaurants, construction firms, supermarkets, a whole network of shops laundering ever more cash.", "caught": "One accounting error sinks most of them: neglecting operating costs. Your expenses must stay coherent with your revenue. Sell €10 pizzas and declare €300,000 in turnover? That's 30,000 pizzas. So you'd better have invoices for 30,000 balls of dough. Many are caught exactly this way, and a street of customer-less shops is itself a red flag investigators know to read."}, {"id": "money-mules", "name": "Money Mules", "summary": "Recruit people to lend their bank accounts to move money. Knowingly or not.", "how": "Upgrade from SMS scams to CEO fraud and the transfers get a hundred times bigger. And a €100,000 transfer from a company to a personal neobank account will be flagged and suspended immediately. You need a reassuring account at a big traditional bank, where opening an account under a stolen identity without showing up in person is nearly impossible. The alternative: recruit a financial mule, someone who lends their own account to let money pass through. Nobody would knowingly accept. When the defrauded company calls its bank, the first door the police knock on is the mule's, who risks a banking ban, a €375,000 fine and five years in prison. So criminals manipulate. The classic is the romance scam: seduce a lonely single online, build the relationship for years, and never ask for money. Only small favours involving transfers. One woman was convinced she was in a long-distance relationship with the star Tyler Perry; the scam lasted 13 years. The subtler variant discovered by the investigation: fake job offers for a 'financial affairs officer' paid €5,000 a month, whose entire job turns out to be placing transfer orders.", "caught": "The mule is the network's sacrificial fuse: they are identified within days of the fraud report, while the organizers stay layers away. With a €5,000 salary, as the video asks. Does the recruit really have any interest in asking questions? The courts increasingly say they should have."}, {"id": "shell-companies", "name": "Anonymous Shell Companies", "summary": "Create companies in secrecy-friendly jurisdictions, fronted by nominees, to build a credible transfer chain.", "how": "Banks distrust company-to-individual transfers, so the next level is the shell company. Find a country where companies can be created anonymously. The US state of Delaware is the world specialist, with 2 million registered companies for 950,000 residents, including one single address that hosts 300,000 entities. Name a nominee. A straw man. To run the company in your name, have him open a professional bank account in France, and you now own the most credible bank drop imaginable. You still can't withdraw €100,000 in cash from it, so you build a transfer chain: the dirty money is fractioned across a multitude of accounts in a network dense enough to lose any investigator. Recruiting the dozens of mules needed to head all these shell companies is a full-time job, so middle managers are hired. Known in the jargon as 'breeders' (éleveurs). They specialize in mule recruitment, openly advertising the deal (for a 2% commission, plenty of people will move money), and they guarantee the chain's reliability by running small test transactions to confirm the money actually arrives.", "caught": "Every bank in the chain demands supporting documents for transactions of this size. Which forces the network into its next vulnerability: fabricating commercial paperwork (see Fake Invoices). The chain is only as strong as its dullest forged document."}, {"id": "fake-invoices", "name": "Fake Invoices & Contracts", "summary": "Give shell companies fake commercial activity so banks accept the transfers between them.", "how": "To satisfy the banks' demands for justification, the shell companies must be given fictitious activities and commercial relationships with each other. The nominees sign fake contracts and fake invoices. A delivery of dropshipped phone cases, say. It's a very hard technique to expose, because no compliance officer is going to drive to the port of Le Havre and open the containers. But the forgeries have to be done well. In a Latvian bank, investigators discovered that corrupt employees had literally written a 'fake invoicing for dummies' guide, with startlingly precise advice: if you invoice a large volume of goods, the delivery destination must be a factory near a railway station or a port. Anything else isn't realistic. And for amounts under €50,000, never use round numbers, because real-life totals never land exactly on a clean sum. Unless you're laundering.", "caught": "The rookie tells: implausible logistics (a warehouse nowhere near transport links) and suspiciously round invoice totals. Compliance teams are trained on exactly these patterns. The Latvian guide exists because getting them wrong kept burning networks."}, {"id": "crossing-borders", "name": "Crossing Borders", "summary": "Route money through multiple countries so investigators drown in slow cross-border cooperation requests.", "how": "Even with a dense domestic chain, money that stays in France is easy prey: Tracfin works with every bank and can access any data. A power called the 'right of communication'. The missing ingredient is borders. Tracfin has no authority over foreign banks; it must file cooperation requests with foreign counterparts, which takes time, and some states are far less constructive than others. The 1996 'Geneva Appeal', signed by seven European anti-corruption magistrates, said it plainly: the opened borders benefit everyone, criminal money included, except judges and police. So big players multiply the crossings. Each new country means fresh cooperation requests and fresh headaches for investigators: you can move hundreds of thousands of euros through a circuit in minutes, while the people chasing it may wait six months per jurisdiction to see the big picture. And by then you've rebuilt the entire circuit.", "caught": "In the 1990s, states responded by creating a Financial Intelligence Unit (FIU) in every country, all wired to cooperate. It works: after a spectacular CEO-fraud, a South African gang bounced its loot from a US bank drop to three South African accounts, then across a dozen banks into personal accounts and luxury cars. FinCEN. The very powerful American FIU. Simply called its South African counterpart, which retraced the entire path and froze every account."}, {"id": "tax-havens", "name": "Bank Secrecy & Tax Havens", "summary": "Hide the trail in jurisdictions where even the authorities can't see the accounts.", "how": "To be sure of losing your pursuers, route the money through countries that cultivate bank secrecy. The idea that banks should shield your financial life from prying eyes, including the state's. The dial varies enormously: in France and the US it sits at zero (the taxman sees everything); in Vanuatu or the Virgin Islands it's at maximum. Even the authorities see nothing. These are the banking havens, the black holes of finance. In the late 1980s the strategy was industrialized. The fortune of Cali co-founder José Santacruz Londoño sat in Panama, dangerously exposed to US pressure. So the cartel recruited Franklin Jurado, a Colombian economist and Harvard graduate, paid $1,000 a day, who designed a phased process, documented in a 20-page memoir, now known as the 'Jurado classification': placement of the cash into the banking system, layering transaction upon transaction, integration back into legitimate businesses. Each phase crossed new countries and banking havens, adding a fresh layer of obfuscation. He ran a 'cavalry': multiplying transfers under $100,000 until the millions landed quietly in a handful of European shell companies, which were then to reinvest in laundering-friendly businesses back in Colombia. Over three years, the money transited from Panama through 16 countries, 68 banks and 115 accounts. The strategy is more alive than ever: in 2020 Europol dismantled a sprawling organization selling cybercriminals a laundering-in-a-kit service for a 50% commission. Bank drop provided, money circulated through domestic then foreign shell networks, delivered clean to an account of the client's choosing.", "caught": "Jurado was undone by two ordinary accidents: his bank in Monaco went bankrupt, and the liquidators' audit surfaced thousands of dubious transactions tied to Jurado and his family; then a Luxembourg neighbor reported a strange night-time hum, a money-counting machine, and the search of his home turned up records detailing every operation. Convicted in Luxembourg, then sentenced to seven and a half years in the US. The lesson investigators drew: even a careful machine has a paper trail somewhere, waiting for luck to expose it."}, {"id": "offshore-havens", "name": "Living Off Offshore Wealth", "summary": "Park the fortune in a secrecy haven and let a shell company quietly fund your lifestyle.", "how": "Once hundreds of thousands can vanish on command, one decision remains: where to put it all. It isn't cash anymore, so the corner shop can't absorb it, and wiring it to a French account means the taxman is waiting. The answer many choose: hide the treasure in a banking haven. The 3,500 richest French are believed to stash more than €150 billion this way. And enjoy it from home. The mechanics: deposit the money with a shell company run, as always, by a nominee. Officially nothing links you to it. The company then 'hires' you for consulting missions, pays you generously, and grants you benefits in kind. A company car, a villa by the sea. In parallel, if you need walking-around cash, open a company account in a nearby secrecy-friendly country like Switzerland and collect anonymous withdrawal cards, usable worldwide, with no name on them at all.", "caught": "The state watches one thing above all: coherence. Declare modest revenues while living like a diva and you end up like Teodorin Obiang, the vice-president of Equatorial Guinea, whose official salary was under $100,000 a year but who spent an estimated $315 million in seven years. A French court convicted him of laundering in 2017 and seized the lot: a 101-room mansion on Avenue Foch worth over €100 million, a fleet of supercars, and $2 million of Michael Jackson memorabilia. The gap between the salary and the spending was the whole case."}, {"id": "failing-companies", "name": "Buying Failing Companies", "summary": "Rescue struggling businesses. Like football clubs. To inject and obscure dirty money.", "how": "Rather than burning the fortune, invest it like a good family patriarch. In companies too desperate to ask questions. A Russian mafia was found targeting exactly that: struggling football clubs. Portugal's UD Leiria had long featured in the first division, but 2012 brought disaster. Last place, relegation to the regional level, bankruptcy. Then, out of nowhere, a generous benefactor appeared: Alexandre Tolstikov, presenting himself as a players' agent in Russia representing mysterious donors who wanted to save the club. Within months he had won the town's trust, and he proposed a rescue plan. On one condition: buying the company. The terms were peculiar: 70% of the club went to an entity owned by a Russian group, itself dependent on several shell companies registered in tax havens. Nobody could say who the real owner was or where the money came from. But the club climbed back to the third division. So nobody felt like digging.", "caught": "The net is tightening structurally: since 2017 an EU directive requires every unlisted company to declare its beneficial owners. The real humans behind the shells. So far only two-thirds of companies have complied, but the pressure rises year after year, and each compliance wave strips another layer of anonymity from deals like Leiria's."}, {"id": "real-estate", "name": "Real Estate", "summary": "A high-value sector with no beneficial-ownership rules. Ideal for hiding and 'explaining' wealth.", "how": "When company ownership gets too transparent, there is another highly profitable sector with no beneficial-ownership declarations at all: real estate. The numbers are striking. More than 33,000 mansions in France have been bought by people describing themselves as unemployed, students or homemakers (almost certainly nominees), and 11% of French land parcels have no known owner at all. The sector is so opaque that every serious criminal has folded it into their investment portfolio. But property's real power is that it can solve the launderer's central problem: whatever you do. Borrowed villas, hidden stakes in companies. You must always respect rule number one: your lifestyle must stay coherent with your declared income. Breaking that rule sank the last three criminals in this story. Real estate, played well, finally lets you tell the state your wealth was earned legally.", "caught": "This is the one method the investigation flags in reverse: the launderers who were never caught often owe it to real estate. The visible red flags are statistical. 'unemployed' buyers of mansions, parcels with no owner. Which is why reformers keep pushing to extend beneficial-ownership rules to property."}, {"id": "back-to-back-loans", "name": "Back-to-Back Loans", "summary": "Deposit dirty money abroad as collateral, then 'borrow' it back as clean, tax-free funds.", "how": "The method was popularized by Meyer Lansky, financial adviser to the Cosa Nostra in the United States, who had been traumatized by the fall of Al Capone. Reputedly untouchable, finally convicted for tax fraud. Lansky refused to make the same mistake. He first hid the mafia's money in Switzerland, then engineered, with a banker, a system to spend it freely in the US: the back-to-back loan. Lansky asks the Swiss bank for a $5 million loan. Normally you'd have to prove you're solvent. He doesn't bother. He simply deposits $5 million of his own as collateral. Deposit five to borrow five: it looks absurd, but now the money in the US is officially a loan from a foreign bank, granted on terms that are nobody's business. And it isn't even taxable. With his back-to-back loans, Lansky helped build a casino city in the desert: Las Vegas. In the 1950s the American and Sicilian mafias used the same trick to finance a network of thousands of Italian-run pizzerias distributing heroin across the American market. The Pizza Connection.", "caught": "The technique remains beloved of crooked politicians. Patrick Balkany, Jérôme Cahuzac and Thomas Fabius are all alleged to have used back-to-back loans. And that is also how it surfaces: when investigators finally pierce the foreign bank's records, the 'loan' and the collateral deposit match too perfectly. Capone's ghost still applies: the tax angle is what they prosecute."}, {"id": "fake-real-estate", "name": "Fake Property Speculation", "summary": "Buy a building cheap on paper, pay the rest in cash under the table, then resell at 'market' to launder the difference.", "how": "For those in a hurry with raw cash to wash, this technique. Flagged by Tracfin and reportedly a favourite of the Russian mafia on the Côte d'Azur. Combines beautifully with the back-to-back loan. Step one: buy a building from a complicit seller at officially 50% of its value. Say €1 million instead of €2 million. And quietly hand over the other million in cash under the table. Step two: do some renovation work. Step three: resell the building, arguing the works have raised its value, at the full €2 million. On paper you've made an honest, sweat-of-your-brow capital gain. In reality you've just laundered €1 million in cash. And the taxman congratulates you on your investment instincts.", "caught": "Tracfin spotted the pattern precisely because the arithmetic is repeatable: the same buyers keep 'discovering' undervalued buildings from the same circles of sellers, and the renovation invoices never quite justify the doubling. Notaries are now on the front line of reporting suspicious price gaps."}, {"id": "trade-based", "name": "Trade-Based Laundering", "summary": "Move value between countries by buying and shipping easily-resold goods instead of wiring money.", "how": "Every scheme so far shares one flaw: it rests entirely on the banking system, which means it is ultimately traceable. One burst of reactivity from the banks, or American pressure on a banking haven, and the whole edifice collapses. The first banking-free alternative is laundering through commerce. Irish police recently unravelled an SMS-scam gang that used it to exfiltrate millions to Nigeria: they bought products online in bulk. Alcohol, clothes, electronics, sometimes enormous consignments like €1.7 million of medicines in one go. And had it all shipped to Nigeria. The only criteria: compact to ship and easy to resell. It's an extremely simple way to transfer value between two countries with zero banking footprint.", "caught": "The defect is the logistics, which are insane: tonnes of merchandise arriving, needing distribution across dozens of shops. That physical footprint is what investigators eventually see. Customs manifests, warehouses, delivery patterns. And it's how the Irish police pulled the thread."}, {"id": "game-currencies", "name": "Video-Game Currencies", "summary": "Convert dirty money into in-game currency, scatter it through microtransactions, then cash out.", "how": "A simpler, more modern parallel currency: video-game money. Roblox is a children's game. A giant virtual playground of 50 million people. Where players buy accessories and mini-games from each other using a dedicated currency, the Robux. During a lawsuit, Roblox was forced to examine its own marketplace, and discovered hundreds of people were actually using the currency to wash dirty money. Once converted into Robux, the funds travelled to accomplice players through hundreds of microtransactions. Some accessories were bought from the same seller more than 50 times. Dispersed, then reconsolidated onto a handful of accounts and finally converted back into dollars. The technique worked so well that within a few years criminals had colonized most in-game and derivative marketplaces: Minecraft, FIFA, Fortnite.", "caught": "The hard limit is market size: buy in bulk, even spread across a group of players, and you eventually distort the marketplace itself. The biggest arena is Counter-Strike: in 2019 Valve stopped letting newly bought loot-box keys be traded after concluding that 'nearly all' such key purchases were fraud-sourced, and by 2025 the third-party market in CS2 skins was estimated above $6 billion. The pattern of one item selling 50 times to the same buyer is exactly what platform audits now hunt."}, {"id": "crypto", "name": "Cryptocurrencies", "summary": "Use peel chains and mixers to obscure crypto whose transactions are otherwise fully public.", "how": "Cryptocurrencies could move far bigger volumes. But they share one huge drawback: transactions are public. Anyone can watch, in real time, where the money comes from and where it goes. The organization that mastered the fog-making tools is Lazarus, North Korea's armed wing of hackers, whose sole mission is funding Kim Jong-un's nuclear program. Five years ago they faced a puzzle: they had stolen $4 billion in crypto, but every one of their wallets was blacklisted. Touch an exchange and the funds freeze instantly. Their answer was the peel chain. Without warning, they would suddenly race funds across a long series of wallets; every watcher scrambles to follow the main flow as fast as possible. And misses the detail that at each hop, a tiny sliver is quietly peeled off to side wallets. Those clean slivers are cashed out through small exchanges too slow to react. To be extra sure, the North Koreans ran peel chains of peel chains. They also used mixers. Services, not criminal in themselves, that pool the coins of a dozen clients, shuffle them, and redistribute them to fresh wallets in random amounts at random times, breaking the chain of traceability and handing the hackers non-blacklisted wallets.", "caught": "The public ledger takes its revenge in volume: peel chains only move slivers, and mixer dilution only works with small injections. Add it all up and, of their $4 billion, the world's best-resourced laundering operation has managed only about $50 million a year since 2020. The blockchain forgives nothing at scale."}, {"id": "casinos", "name": "Casinos", "summary": "Convert cash to chips, play a low-loss game, then cash out as 'winnings'.", "how": "The last parallel market handles millions while dodging every constraint so far. In February 2016 the North Koreans stole $81 million from Bangladesh's central bank and made it disappear through casinos in the Philippines. The plan: convert the money into chips, play at the tables, then exchange the 'winnings' for money on accomplice players' accounts. Or directly in cash. Won't they lose it all gambling? An expert recounts that in some Moroccan casinos, players bet on all 37 squares of the roulette wheel: they lose plenty, but they know their exact yield. The North Koreans did better. They played baccarat, a blackjack-like game which, played with precision over many hands, caps losses at around 10%. And $81 million is a lot of chips to move, so they optimized: private rooms, closed tables where every player was an accomplice. Week after week they bet suitcases of chips, converted them, and shipped the value on to other casinos in Macau. Where nobody would ever find the trail again.", "caught": "The Bangladesh heist is documented precisely because the scale showed: casinos cannot silently digest tens of millions, and the Philippine legs of the operation were reconstructed. The deeper limit is arithmetic. The baccarat toll means roughly one dollar in ten burns on every wash cycle."}, {"id": "complicit-banks", "name": "Complicit Banks & Insiders", "summary": "A banker who betrays the profession can launder billions for a fraction of the usual fee.", "how": "At true multinational-of-crime scale. Billions a year. Bitcoin and casinos can't digest the flow and the banks aren't blind. Then one day a man in a suit makes you a disconcerting offer: 'I can launder your billions, and it won't cost you the 10–15% the mafias usually pay. It will cost you 0.1%.' He is what the investigation calls a bankster: a banker who has betrayed his profession, running a respectable bank that pretends to apply anti-laundering rules while secretly working for crime. And it isn't just small regional banks. In the 2010s, a world-class bank. HSBC. Was found to be in league with the Mexican cartels, who collected $50 billion a year in cash and placed it into the banking system with mysterious ease. Their couriers carried Samsonite suitcases and sports bags stuffed with $100 bills fresh from the streets of Los Angeles, Seattle and Chicago, often wearing leather jackets with the Sinaloa or Los Zetas cartel emblem on the back. In 2016, at the Mexico City branch, cartel men strolled in wearing their colours. And were served at special counters set up to pass their bags of cash. Sometimes the rot is a single person: in 2017 in the UK, the head of personal accounts at Barclays was discovered secretly working for a Moldovan gang, running a circuit of 400 accounts across Europe that laundered €17 million.", "caught": "The Americans eventually noticed the little routine and hid surveillance cameras inside the bank itself, building the case that forced HSBC to trial. The outcome is the investigation's bitterest lesson: after years of proceedings, a $2 billion fine. Basically nothing at HSBC's scale. And not one person went to prison."}, {"id": "laundromat", "name": "The Automatic Laundromat", "summary": "An industrial, shared laundering pipeline that washed billions for hundreds of criminal groups at once.", "how": "How does the bankster get his fee down to 0.1%? In the 2010s, a group of Eastern European financiers found the magic answer. First, they secured a bank that would close its eyes to incoming dirty money: Ūkio Bankas, in Lithuania. Then they built the classic machine. Shell companies, nominees, fake invoices. With one brilliant twist: nothing would be single-use. The same companies and the same bank accounts would serve all clients simultaneously, for a maximum economy of scale. For that to work they needed enormous transaction volume. Billions upon billions. So they went out and pitched hundreds of criminal organizations, like any startup chasing customers. It worked. The result was a colossal pipeline that journalists would later christen the 'automatic laundromat': dirty money in one end, clean money out the other, for anyone willing to pay a sliver of a percent.", "caught": "We know all of this because in 2019 a consortium of journalists led by OCCRP published a leak of banking records: a core of just 75 shell companies, 1.3 million transactions, and by some tallies as much as €26 billion pushed through Ūkio Bankas. The leak revealed something else. This wasn't the only laundromat. The 'Azerbaijani Laundromat' had been running in parallel. As the investigation dryly notes: there will always be a laundromat somewhere, happy to serve you."}, {"id": "economic-control", "name": "Controlling the Economy", "summary": "Use laundered billions to take over whole sectors by undercutting and eliminating rivals.", "how": "With €20 billion clean, you could buy a private island, a Premier League football club, a fleet of superyachts. But there's better: taking control of entire sectors of the economy. Researchers studying the mafias' impact on market economies identified the phenomenon and named it 'distortion of competition'. And the Italian mafias are its masters. They take over small businesses, restaurants for example, and reason simply: why settle for laundering money? We don't actually need the restaurant's profit. So they smash their own prices, sell at a loss, and conquer the whole market. Competitors. Who do need to make a living. Are driven out one by one. Once the monopoly is won, quietly, the prices go back up. In some Italian territories, entire swathes of the economy have flipped into mafia hands this way: construction, tourism, cleaning companies, catering. The mafia is now estimated to control around 10% of Italy's GDP.", "caught": "The very research that named the phenomenon is the counterweapon: economists can now detect the statistical signature of distorted competition. Businesses that survive years of impossible pricing. And Italian anti-mafia prosecutors use exactly those anomalies to pick targets."}, {"id": "political-power", "name": "Buying Political Power", "summary": "The final ambition: turn laundered wealth into public legitimacy and elected office.", "how": "Is economic power enough? In France, business success earns you public affection. You pay your taxes, you fund the country, you're a benefactor, a Bernard Tapie of the 21st century, the self-made man who proves anything is possible. So why not run for office? You wouldn't be the first. Pablo Escobar tried in 1982, standing in Colombia's legislative elections and doing everything to win: raining money on his district, building schools and football stadiums, corrupting the local press. It worked. The head of the Medellín cartel became a deputy in Colombia's National Assembly. Joe Kennedy played a longer game. A Prohibition-era alcohol smuggler allied with the New York mafia, he became a billionaire with his real goal fixed on the White House. He backed Roosevelt heavily in 1933. Networks, unlimited spending, a key role in the victory. But Roosevelt froze him out over his reputation. So Kennedy switched strategy and bet everything on his son: for years he kept him carefully away from the family's affairs, snow-white. In 1960 he launched him into the Democratic primary, bought delegate votes across every key state. And John F. Kennedy became the 35th President of the United States.", "caught": "Stepping into the light means your whole story gets combed through. And however well the fortune was washed, something is always findable. Escobar's reputation preceded him: the government ordered an investigation, proved his campaign was financed by occult means, and his election was annulled. Kennedy's lesson is darker: the one who never ran, never got caught."}]</script>

/* ---------- key terms (plain-language glosses) ---------- */
const TERMS = {
  "KYC":"Know Your Customer. The identity checks a bank runs before opening an account: documents, proof of address, and increasingly a live selfie.",
  "FIU":"Financial Intelligence Unit. The government body that hunts suspicious money, like France's Tracfin or America's FinCEN.",
  "Tracfin":"France's Financial Intelligence Unit. It receives the banks' suspicious-activity reports and can look inside any account at any French bank.",
  "suspicious activity report":"A confidential note a bank files with the national Financial Intelligence Unit when a transaction smells wrong. The customer is never told.",
  "Francis “the Belgian”":"Francis Vanverberghe (1946–2000), Marseille-born figure of the French underworld and a veteran of the French Connection heroin era. Fittingly, he was shot dead in 2000 in a Paris betting bar.",
  "smurfing":"Splitting one big deposit into many tiny ones so no single payment is large enough to be reported.",
  "bank drop":"A throwaway bank account used to catch a fraudulent payment and empty it before it can be frozen.",
  "money mule":"Someone who lets their bank account be used to move other people's money, often without fully understanding it.",
  "shell company":"A company that exists only on paper, with no real business, used to move or hold money behind a stand-in owner.",

function phArt(motif,ratio){

  const w=dims[0],h=dims[1],cx=w/2,cy=h/2;
  let motes='';
  for(let i=0;i<16;i++){ const x=(i*137+40)%w, y=20+((i*89+15)%(h-40)), r=(0.8+(i%3)*0.6).toFixed(2), a=(0.05+((i*3)%4)*0.03).toFixed(3), mv=(i%5===2)?' sp-mote m'+((i%3)+1):''; motes+='<circle class="spd'+mv+'" cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+ICE+a+')"/>'; }

}

function imgSlot(id){

FIGS.orgchart = function(){
  const NOM=[110,230,350,470,590], BRD=[170,350,530], ORG=350, CAUGHT=470;
